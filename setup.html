<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Setup — Gestão PMS</title>
<link rel="icon" href="img/logo_sertania.png">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:#080f1e;display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',system-ui,sans-serif;padding:20px;color:#e2e8f0}
.card{background:#0e1729;border:1px solid #1e3a5f;border-radius:16px;padding:36px;width:100%;max-width:480px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
h2{font-size:20px;font-weight:800;margin-bottom:6px}
.sub{font-size:13px;color:#64748b;margin-bottom:24px}
.user-list{display:flex;flex-direction:column;gap:8px;margin-bottom:24px}
.user-item{background:#0a1222;border:1px solid #1e3a5f;border-radius:10px;padding:12px 16px;display:flex;align-items:center;gap:12px}
.u-av{width:34px;height:34px;border-radius:50%;background:#2563eb;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0}
.u-info{flex:1}
.u-name{font-weight:700;font-size:14px}
.u-role{font-size:11px;color:#64748b}
.u-status{font-size:12px;font-weight:600}
.btn{width:100%;background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;border:none;border-radius:10px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;transition:opacity .2s}
.btn:hover{opacity:.9}
.btn:disabled{opacity:.55;cursor:not-allowed}
.log{background:#020810;border:1px solid #1e3a5f;border-radius:8px;padding:12px;font-size:12px;font-family:monospace;color:#64748b;margin-top:16px;max-height:180px;overflow-y:auto;display:none}
.log p{margin-bottom:4px}
.log .ok{color:#34d399}
.log .err{color:#f87171}
.log .info{color:#60a5fa}
.done-box{background:rgba(16,185,129,.08);border:1px solid rgba(16,185,129,.25);border-radius:10px;padding:16px;text-align:center;margin-top:16px;display:none}
.done-box a{color:#34d399;font-weight:700;text-decoration:none}
</style>
</head>
<body>
<div class="card">
  <h2>⚙️ Configuração Inicial</h2>
  <p class="sub">Cria os usuários do sistema automaticamente. Execute apenas uma vez.</p>

  <div class="user-list">
    <div class="user-item">
      <div class="u-av" style="background:#8b5cf6">RC</div>
      <div class="u-info"><div class="u-name">RCAMPOS</div><div class="u-role">🔑 Administrador · senha: rcampos123</div></div>
      <div class="u-status" id="st-rcampos">⏳</div>
    </div>
    <div class="user-item">
      <div class="u-av" style="background:#dc2626">AD</div>
      <div class="u-info"><div class="u-name">admin</div><div class="u-role">🔑 Administrador · senha: admin123</div></div>
      <div class="u-status" id="st-admin">⏳</div>
    </div>
    <div class="user-item">
      <div class="u-av" style="background:#0891b2">CW</div>
      <div class="u-info"><div class="u-name">camposweb</div><div class="u-role">🔑 Administrador · senha: camposweb123</div></div>
      <div class="u-status" id="st-camposweb">⏳</div>
    </div>
  </div>

  <button class="btn" id="btn" onclick="runSetup()">🚀 Criar Usuários Agora</button>
  <div class="log" id="log"></div>
  <div class="done-box" id="done-box">
    ✅ <strong>Tudo pronto!</strong><br><br>
    <a href="login.html">→ Ir para o Login</a>
  </div>
</div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/11.8.1/firebase-app.js";
import{getFirestore,doc,setDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/11.8.1/firebase-firestore.js";

const FB={apiKey:"AIzaSyBy_k7nY2legV17h53GaU-7-usDvtnOzjs",authDomain:"gestao-atividades-26257.firebaseapp.com",projectId:"gestao-atividades-26257",storageBucket:"gestao-atividades-26257.firebasestorage.app",messagingSenderId:"113932809324",appId:"1:113932809324:web:b441b9549106822a9cd449"};
const fbApp=initializeApp(FB);
const db=getFirestore(fbApp);
const API_KEY=FB.apiKey;
const DOMAIN='@pms.sertania';

const USERS=[
  {username:'RCAMPOS', email:'rcampos'+DOMAIN, password:'rcampos123', role:'admin'},
  {username:'admin',   email:'admin'+DOMAIN,   password:'admin123',   role:'admin'},
  {username:'camposweb',email:'camposweb'+DOMAIN,password:'camposweb123',role:'admin'},
];

function log(msg,type='info'){
  const el=document.getElementById('log');
  el.style.display='block';
  const p=document.createElement('p');
  p.className=type;p.textContent=msg;
  el.appendChild(p);el.scrollTop=el.scrollHeight;
}

async function createUser(u){
  // 1. Create via REST API
  const r=await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${API_KEY}`,{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({email:u.email,password:u.password,returnSecureToken:true})
  });
  const j=await r.json();
  if(j.error){
    // If already exists, try to sign in to get UID
    if(j.error.message==='EMAIL_EXISTS'){
      log(`  ↺ ${u.username} já existe — obtendo UID...`,'info');
      const r2=await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${API_KEY}`,{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({email:u.email,password:u.password,returnSecureToken:true})
      });
      const j2=await r2.json();
      if(j2.error)throw new Error(j2.error.message);
      return j2.localId;
    }
    throw new Error(j.error.message);
  }
  return j.localId;
}

window.runSetup=async function(){
  const btn=document.getElementById('btn');
  btn.disabled=true;btn.textContent='Criando…';
  let ok=0;
  for(const u of USERS){
    const st=document.getElementById('st-'+u.username.toLowerCase());
    log(`Criando usuário ${u.username}...`);
    try{
      const uid=await createUser(u);
      // Save to Firestore /users
      await setDoc(doc(db,'users',uid),{
        username:u.username.toUpperCase(),
        displayName:u.username.toUpperCase(),
        email:u.email,role:u.role,
        isAdmin:true,created_at:serverTimestamp()
      });
      st.textContent='✅';
      log(`  ✅ ${u.username} criado com sucesso! UID: ${uid}`,'ok');
      ok++;
    }catch(e){
      st.textContent='❌';
      log(`  ❌ Erro em ${u.username}: ${e.message}`,'err');
    }
  }
  if(ok>0){
    document.getElementById('done-box').style.display='block';
    btn.textContent='✅ Concluído';
    log(`\n${ok} de ${USERS.length} usuários prontos. Pode ir para o login!`,'ok');
  }else{
    btn.disabled=false;btn.textContent='Tentar Novamente';
  }
};
</script>
</body>
</html>
