<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Setup — Gestão PMS</title>
<link rel="icon" href="img/logo_sertania.png">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:#080f1e;display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',system-ui,sans-serif;padding:20px;color:#e2e8f0}
.card{background:#0e1729;border:1px solid #1e3a5f;border-radius:16px;padding:36px;width:100%;max-width:480px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
h2{font-size:20px;font-weight:800;margin-bottom:6px}
.sub{font-size:13px;color:#64748b;margin-bottom:24px}
.user-list{display:flex;flex-direction:column;gap:8px;margin-bottom:24px}
.user-item{background:#0a1222;border:1px solid #1e3a5f;border-radius:10px;padding:12px 16px;display:flex;align-items:center;gap:12px}
.u-av{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0}
.u-info{flex:1}.u-name{font-weight:700;font-size:14px}.u-role{font-size:11px;color:#64748b}
.u-st{font-size:16px}
.btn{width:100%;background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;border:none;border-radius:10px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;transition:opacity .2s}
.btn:hover{opacity:.9}.btn:disabled{opacity:.55;cursor:not-allowed}
.log{background:#020810;border:1px solid #1e3a5f;border-radius:8px;padding:12px;font-size:12px;font-family:monospace;color:#64748b;margin-top:16px;max-height:200px;overflow-y:auto;display:none}
.log p{margin-bottom:4px}.ok{color:#34d399}.er{color:#f87171}.in{color:#60a5fa}
.done{background:rgba(16,185,129,.08);border:1px solid rgba(16,185,129,.25);border-radius:10px;padding:16px;text-align:center;margin-top:16px;display:none;line-height:1.8}
.done a{color:#34d399;font-weight:700;text-decoration:none;font-size:15px}
</style>
</head>
<body>
<div class="card">
  <h2>⚙️ Configuração Inicial</h2>
  <p class="sub">Cria os usuários do sistema. Execute apenas uma vez.</p>
  <div class="user-list">
    <div class="user-item"><div class="u-av" style="background:#8b5cf6">RC</div><div class="u-info"><div class="u-name">RCAMPOS</div><div class="u-role">🔑 Admin · senha: rcampos123</div></div><div class="u-st" id="st-0">⏳</div></div>
    <div class="user-item"><div class="u-av" style="background:#dc2626">AD</div><div class="u-info"><div class="u-name">admin</div><div class="u-role">🔑 Admin · senha: admin123</div></div><div class="u-st" id="st-1">⏳</div></div>
    <div class="user-item"><div class="u-av" style="background:#0891b2">CW</div><div class="u-info"><div class="u-name">camposweb</div><div class="u-role">🔑 Admin · senha: camposweb123</div></div><div class="u-st" id="st-2">⏳</div></div>
  </div>
  <button class="btn" id="btn" onclick="runSetup()">🚀 Criar Usuários Agora</button>
  <div class="log" id="log"></div>
  <div class="done" id="done">✅ <strong>Tudo pronto!</strong><br><br><a href="login.html">→ Ir para o Login</a></div>
</div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/11.8.1/firebase-app.js";
import{getAuth,signInWithEmailAndPassword,signOut,createUserWithEmailAndPassword}from"https://www.gstatic.com/firebasejs/11.8.1/firebase-auth.js";
import{getFirestore,doc,setDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/11.8.1/firebase-firestore.js";

const FB={apiKey:"AIzaSyBy_k7nY2legV17h53GaU-7-usDvtnOzjs",authDomain:"gestao-atividades-26257.firebaseapp.com",projectId:"gestao-atividades-26257",storageBucket:"gestao-atividades-26257.firebasestorage.app",messagingSenderId:"113932809324",appId:"1:113932809324:web:b441b9549106822a9cd449"};
const app=initializeApp(FB);
const auth=getAuth(app);
const db=getFirestore(app);
const DOM='@pms.sertania';

const USERS=[
  {i:0,username:'RCAMPOS',email:'rcampos'+DOM,password:'rcampos123',role:'admin'},
  {i:1,username:'admin',  email:'admin'+DOM,  password:'admin123',  role:'admin'},
  {i:2,username:'camposweb',email:'camposweb'+DOM,password:'camposweb123',role:'admin'},
];

function log(msg,cls='in'){const el=document.getElementById('log');el.style.display='block';const p=document.createElement('p');p.className=cls;p.textContent=msg;el.appendChild(p);el.scrollTop=el.scrollHeight;}

window.runSetup=async function(){
  const btn=document.getElementById('btn');btn.disabled=true;btn.textContent='Criando…';
  let ok=0;
  for(const u of USERS){
    const st=document.getElementById('st-'+u.i);
    log('Processando '+u.username+'…');
    try{
      let uid;
      // 1. Tenta criar
      try{
        const cred=await createUserWithEmailAndPassword(auth,u.email,u.password);
        uid=cred.user.uid;
        log('  ✅ Criado: '+u.username,'ok');
      }catch(e){
        if(e.code==='auth/email-already-in-use'){
          // 2. Já existe — faz login para pegar UID
          log('  ↺ Já existe — fazendo login…');
          const cred=await signInWithEmailAndPassword(auth,u.email,u.password);
          uid=cred.user.uid;
          log('  ✅ Login OK, UID: '+uid,'ok');
        } else { throw e; }
      }
      // 3. Salva no Firestore (autenticado)
      await setDoc(doc(db,'users',uid),{
        username:u.username.toUpperCase(),
        displayName:u.username.toUpperCase(),
        email:u.email,role:u.role,isAdmin:true,
        created_at:serverTimestamp()
      });
      log('  💾 Firestore salvo!','ok');
      st.textContent='✅';ok++;
    }catch(e){
      log('  ❌ Erro em '+u.username+': '+e.message,'er');
      st.textContent='❌';
    }finally{
      try{await signOut(auth);}catch(e){}
    }
  }
  if(ok===USERS.length){
    document.getElementById('done').style.display='block';
    btn.textContent='✅ Concluído';
    log('\n🎉 '+ok+' usuários prontos! Clique em "Ir para o Login".','ok');
  }else{
    btn.disabled=false;btn.textContent='Tentar Novamente';
    log('\n⚠️ Atualize as regras do Firestore e tente novamente.','er');
  }
};
</script>
</body>
</html>
