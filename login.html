<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#071b2d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<title>Login — Gestão de Atividades PMS</title>
<link rel="icon" href="img/logo_sertania.png">
<link rel="apple-touch-icon" href="img/logo_sertania.png">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{color-scheme:light}
body{min-height:100vh;background:linear-gradient(105deg,#071827 0%,#0a3b38 42%,#eef3f7 42%,#f7f9fb 100%);display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',system-ui,sans-serif;padding:24px;color:#172033}
.card{position:relative;overflow:hidden;background:#fff;border:1px solid #dbe4ec;border-radius:24px;padding:42px 40px;width:100%;max-width:430px;box-shadow:0 30px 80px rgba(6,28,43,.2)}
.card::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:linear-gradient(90deg,#75c044,#16803d,#f5b82e)}
.logo-row{display:flex;align-items:center;justify-content:center;gap:13px;margin-bottom:31px}
.logo-row img{height:58px;object-fit:contain;filter:drop-shadow(0 5px 10px rgba(10,53,52,.16))}
.logo-txt{font-size:12px;font-weight:750;color:#617184;letter-spacing:.8px;text-transform:uppercase;line-height:1.35}
.logo-txt strong{display:block;font-size:18px;color:#18324a;letter-spacing:.1px}
h2{text-align:center;font-size:25px;font-weight:850;color:#142337;margin-bottom:7px;letter-spacing:-.035em}
.sub{text-align:center;font-size:14px;color:#56657a;margin-bottom:29px}
.field{margin-bottom:17px;position:relative}
.field label{display:block;font-size:12px;font-weight:750;color:#526174;margin-bottom:7px;letter-spacing:.3px;text-transform:uppercase}
.field input{width:100%;min-height:48px;background:#f8fafc;border:1px solid #cbd7e2;border-radius:11px;color:#172033;padding:12px 15px;font-size:15px;outline:none;transition:border-color .2s,box-shadow .2s,background .2s;letter-spacing:.2px}
.field input:focus{background:#fff;border-color:#16803d;box-shadow:0 0 0 4px rgba(22,128,61,.11)}
.field input::placeholder{color:#9aa8b7;letter-spacing:0}
.btn{width:100%;background:linear-gradient(135deg,#16803d,#0c6741);color:#fff;border:none;border-radius:11px;padding:14px;font-size:15px;font-weight:800;cursor:pointer;margin-top:9px;transition:filter .2s,transform .1s,box-shadow .2s;letter-spacing:.2px;box-shadow:0 10px 23px rgba(22,128,61,.22)}
.btn:hover{filter:brightness(1.06);box-shadow:0 13px 28px rgba(22,128,61,.28)}
.btn:active{transform:scale(.985)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.err{background:#fff1f2;border:1px solid #fecdd3;color:#be123c;border-radius:9px;padding:11px 14px;font-size:13px;text-align:center;margin-top:14px;display:none}
.footer{text-align:center;font-size:11px;color:#5d6b7c;margin-top:29px}
.linkbtn{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 10px;border:0;background:none;color:#11653f;font-size:14px;font-weight:750;cursor:pointer;border-radius:8px}
.linkbtn:hover{background:#eef8f2;text-decoration:underline}.linkbtn:focus-visible{outline:3px solid #2563eb}
.view[hidden]{display:none}
.pass-wrap{position:relative}.pass-wrap input{padding-right:54px}
.eye{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:44px;height:40px;display:grid;place-items:center;border:0;border-radius:9px;background:transparent;color:#46566a;cursor:pointer}
.eye:hover{background:#e8f1ec;color:#11653f}.eye:focus-visible{outline:3px solid #2563eb}
.eye .eye-slash{display:none}.eye[aria-pressed="true"] .eye-open{display:none}.eye[aria-pressed="true"] .eye-slash{display:inline}.eye[aria-pressed="true"]{color:#11653f}
.caps{margin-top:6px;font-size:12px;font-weight:700;color:#7a4a00}.caps[hidden]{display:none}
.ok{background:#ecfdf3;border:1px solid #a7e3bf;color:#11553f;border-radius:9px;padding:12px 14px;font-size:14px;line-height:1.45;margin-top:14px}
.ok[hidden]{display:none}
.hint{font-size:13px;color:#46566a;line-height:1.5;margin:-14px 0 20px;text-align:center}
.who{display:flex;justify-content:center;gap:8px;align-items:center;margin:6px 0 20px;flex-wrap:wrap}
.who b{font-size:15px;color:#142337}.who code{font-size:13px;font-weight:700;color:#0b4f8a;background:#e6f0f8;border:1px solid #b9d3e8;border-radius:999px;padding:3px 10px}
.pass-row{display:flex;gap:8px}.pass-row input{flex:1;font-family:ui-monospace,Menlo,Consolas,monospace}
.pass-row button{flex:0 0 auto;min-height:48px;padding:0 12px;border:1px solid #cbd7e2;border-radius:11px;background:#fff;color:#11653f;font-weight:800;cursor:pointer}
.meter{font-size:12px;font-weight:700;margin-top:6px;min-height:16px}.meter.weak{color:#a1261b}.meter.okk{color:#7a4a00}.meter.strong{color:#11653f}
@media(max-width:700px){body{background:linear-gradient(180deg,#071827 0,#0a3b38 25%,#eef3f7 25%);padding:18px}.card{padding:34px 25px;border-radius:20px}}
</style>
</head>
<body>
<div class="card">
  <div class="logo-row">
    <img src="img/logo_sertania.png" alt="Logo PMS">
    <div class="logo-txt"><span>Prefeitura Municipal de</span><strong>Sertânia</strong></div>
  </div>
  <section class="view" id="v-login">
  <h2>Bem-vindo</h2>
  <p class="sub">Sistema de Gestão de Atividades</p>
  <div class="field">
    <label for="usuario">Usuário</label>
    <input type="text" id="usuario" autocomplete="username" autocapitalize="off" spellcheck="false">
  </div>
  <div class="field">
    <label for="senha">Senha</label>
    <div class="pass-wrap"><input type="password" id="senha" placeholder="••••••••" autocomplete="current-password"><button type="button" class="eye" id="eye" onclick="toggleEye()" aria-label="Mostrar senha" aria-pressed="false" title="Mostrar senha"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path class="eye-open" d="M12 5C6.5 5 2.7 9.3 1.5 12c1.2 2.7 5 7 10.5 7s9.3-4.3 10.5-7C21.3 9.3 17.5 5 12 5Zm0 11.5A4.5 4.5 0 1 1 12 7.5a4.5 4.5 0 0 1 0 9Zm0-2.5a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z" fill="currentColor"/><path class="eye-slash" d="M3.3 2 2 3.3l3.2 3.2C3.5 7.9 2.2 9.9 1.5 12c1.2 2.7 5 7 10.5 7 2 0 3.8-.6 5.3-1.4l3.4 3.4 1.3-1.3L3.3 2ZM12 16.5A4.5 4.5 0 0 1 7.5 12c0-.8.2-1.5.5-2.2l1.6 1.6a2 2 0 0 0 2.9 2.9l1.6 1.6c-.6.4-1.3.6-2.1.6Zm10.5-4.5C21.3 9.3 17.5 5 12 5c-1.2 0-2.3.2-3.3.6l2 2c.4-.1.9-.1 1.3-.1a4.5 4.5 0 0 1 4.5 4.5c0 .4 0 .9-.1 1.3l2.9 2.9c1.5-1.2 2.6-2.7 3.2-4.2Z" fill="currentColor"/></svg></button></div>
    <div class="caps" id="caps" hidden>⇪ Caps Lock está ligado</div>
  </div>
  <button class="btn" id="btn" onclick="doLogin()">Entrar</button>
  <div style="text-align:center;margin-top:12px"><button type="button" class="linkbtn" onclick="showForgot()">🔑 Esqueci minha senha</button></div>
  </section>

  <section class="view" id="v-forgot" hidden>
  <h2>Esqueci minha senha</h2>
  <p class="sub">Enviaremos um link para o e-mail de contato cadastrado em Usuários e acessos.</p>
  <div class="field">
    <label for="f-usuario">Seu usuário</label>
    <input type="text" id="f-usuario" autocomplete="username" autocapitalize="off" spellcheck="false" placeholder="Ex.: claudiaif">
  </div>
  <button class="btn" id="f-btn" onclick="requestReset()">✉️ Enviar link por e-mail</button>
  <div class="ok" id="f-ok" role="status" hidden></div>
  <div style="text-align:center;margin-top:12px"><button type="button" class="linkbtn" onclick="showLogin()">← Voltar ao login</button></div>
  </section>

  <section class="view" id="v-reset" hidden>
  <h2>Criar nova senha</h2>
  <div class="who" id="r-who"></div>
  <div class="field">
    <label for="r-senha">Nova senha <span style="text-transform:none;font-weight:600">(fica visível para você conferir)</span></label>
    <div class="pass-row"><input type="text" id="r-senha" autocomplete="new-password" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Mínimo 6 caracteres" oninput="paintMeter()"><button type="button" onclick="suggest()" title="Sugerir uma senha fácil de lembrar">🎲 Sugerir</button></div>
    <div class="meter" id="r-meter" aria-live="polite"></div>
  </div>
  <button class="btn" id="r-btn" onclick="confirmReset()">Salvar nova senha</button>
  <div class="ok" id="r-ok" role="status" hidden></div>
  <div style="text-align:center;margin-top:12px"><button type="button" class="linkbtn" onclick="showLogin(true)">← Ir para o login</button></div>
  </section>
  <div class="err" id="err" role="alert"></div>
  <div class="footer">Gestão de Atividades PMS &copy; 2026</div>
</div>

<script type="module">
import {loginEmails,signInUsername} from './js/usuario-login.js';
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.49.0';

const SUPABASE_URL = 'https://xwlmpxypjheuhbxyfplo.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh3bG1weHlwamhldWhieHlmcGxvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM5NjQ1OTEsImV4cCI6MjA5OTU0MDU5MX0.ugbn_guMLqk_I9I9OElI_VKAA8pDpW3trVWr1lT9oQU';
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// Se já logado, vai direto para o app
const resetRoute=()=>(location.hash.match(/^#redefinir-senha\/([A-Za-z0-9_-]{20,})/)||[])[1]||'';
supabase.auth.getSession().then(({ data })=>{ if(data.session&&!resetRoute()) location.href='index.html'; });
supabase.auth.onAuthStateChange((event, session)=>{ if(session&&!resetRoute()&&!window.__resetting) location.href='index.html'; });

// Converte usuário → email interno
function toEmail(user){return loginEmails(user)[0];}

window.doLogin=async function(){
  const user=document.getElementById('usuario').value.trim();
  const pass=document.getElementById('senha').value;
  const btn=document.getElementById('btn');
  const err=document.getElementById('err');
  if(!user||!pass){showErr('Preencha usuário e senha.');return;}
  btn.disabled=true;btn.textContent='Entrando…';err.style.display='none';
  try{
    const { data, error } = await signInUsername(supabase.auth,user,pass);
    if(error) throw error;
    // Aguarda a sessão ser persistida antes de redirecionar
    if(data.session){
      await supabase.auth.setSession({ access_token: data.session.access_token, refresh_token: data.session.refresh_token });
    }
    setTimeout(()=>location.href='index.html', 300);
  }catch(e){
    const msg=e.message||e.code||'';
    const msgs={
      'Invalid login credentials':'Usuário ou senha incorretos.',
      'Email not confirmed':'E-mail não confirmado.',
      'User not found':'Usuário não encontrado.',
      'too-many-requests':'Muitas tentativas. Aguarde alguns minutos.'
    };
    showErr(msgs[msg]||'Erro ao entrar. Tente novamente. ('+msg+')');
    btn.disabled=false;btn.textContent='Entrar';
  }
};

// ── Esqueci minha senha (link de uso único no e-mail de contato) ──
const REASONS={
  nao_configurado:'O envio de e-mails ainda não foi configurado. Peça ao administrador para trocar sua senha.',
  nao_encontrado:'Usuário não encontrado. Confira como você digita no login.',
  sem_email:'Seu usuário não tem e-mail de contato cadastrado. Peça ao administrador para cadastrar ou trocar sua senha.',
  limite:'Muitos pedidos seguidos. Aguarde uma hora ou peça ao administrador.',
  smtp_login:'O servidor de e-mail recusou o envio. Avise o administrador.',
  invalido:'Este link já foi usado ou expirou. Peça um novo em “Esqueci minha senha”.',
  senha_curta:'A senha precisa ter pelo menos 6 caracteres.',
  falha:'Não foi possível concluir agora. Tente de novo em instantes.'
};
const call=async body=>{const {data,error}=await supabase.functions.invoke('password-reset',{body});if(error)throw error;return data||{};};
const view=id=>{document.querySelectorAll('.view').forEach(v=>v.hidden=v.id!==id);hideErr();};
function hideErr(){const e=document.getElementById('err');e.style.display='none';}
window.showForgot=()=>{view('v-forgot');const u=document.getElementById('usuario').value.trim();const f=document.getElementById('f-usuario');if(u)f.value=u;document.getElementById('f-ok').hidden=true;f.focus();};
window.showLogin=(clear)=>{if(clear)history.replaceState(null,'',location.pathname);view('v-login');document.getElementById('usuario').focus();};
window.requestReset=async function(){
  const login=document.getElementById('f-usuario').value.trim(),btn=document.getElementById('f-btn'),ok=document.getElementById('f-ok');
  if(!login){showErr('Digite seu usuário.');return;}
  btn.disabled=true;btn.textContent='Enviando…';hideErr();ok.hidden=true;
  try{
    const r=await call({action:'request',login});
    if(r.ok){ok.hidden=false;ok.innerHTML=`✅ Link enviado para <b>${r.sent_to}</b>.<br>Abra o e-mail (confira também o spam) e toque em <b>Criar nova senha</b>. O link vale por 30 minutos.`;}
    else showErr(REASONS[r.reason]||REASONS.falha);
  }catch(e){showErr(REASONS.falha);}
  finally{btn.disabled=false;btn.textContent='✉️ Enviar link por e-mail';}
};
window.suggest=function(){const w=['sol','rio','mar','pipa','caju','ipe','serra','lua','vento','barro','milho','agua','cacto','jatoba','umbu'];const r=()=>crypto.getRandomValues(new Uint32Array(1))[0];const i=document.getElementById('r-senha');i.value=`${w[r()%w.length]}-${w[r()%w.length]}-${10+r()%90}`;paintMeter();i.focus();};
window.paintMeter=function(){const v=document.getElementById('r-senha').value,m=document.getElementById('r-meter');if(!v){m.textContent='';m.className='meter';return;}const k=[/[a-z]/,/[A-Z]/,/\d/,/[^A-Za-z0-9]/].filter(x=>x.test(v)).length;const l=v.length<6?0:(v.length>=10&&k>=2)||v.length>=14?2:1;m.className='meter '+['weak','okk','strong'][l];m.textContent=['Curta demais · mínimo 6','Senha aceitável','Senha forte'][l]+` · ${v.length} caracteres`;};
async function openReset(token){
  view('v-reset');
  const who=document.getElementById('r-who'),btn=document.getElementById('r-btn');
  who.textContent='Conferindo o link…';btn.disabled=true;
  try{
    const r=await call({action:'check',token});
    if(!r.ok){who.textContent='';showErr(REASONS[r.reason]||REASONS.invalido);return;}
    who.innerHTML='';const b=document.createElement('b');b.textContent=r.name||'Usuário';const c=document.createElement('code');c.textContent=r.login;who.append(b,c);
    btn.disabled=false;document.getElementById('r-senha').focus();
  }catch(e){who.textContent='';showErr(REASONS.falha);}
}
window.confirmReset=async function(){
  const token=resetRoute(),password=document.getElementById('r-senha').value,btn=document.getElementById('r-btn');
  if(password.length<6){showErr(REASONS.senha_curta);return;}
  btn.disabled=true;btn.textContent='Salvando…';hideErr();
  try{
    const r=await call({action:'confirm',token,password});
    if(!r.ok){showErr(REASONS[r.reason]||REASONS.falha);btn.disabled=false;btn.textContent='Salvar nova senha';return;}
    const ok=document.getElementById('r-ok');ok.hidden=false;ok.innerHTML='✅ Senha alterada! Entrando…';btn.hidden=true;
    window.__resetting=true;history.replaceState(null,'',location.pathname);
    const {error}=await signInUsername(supabase.auth,r.login,password);
    if(error){ok.innerHTML='✅ Senha alterada! Agora entre com o usuário <b></b> e a nova senha.';ok.querySelector('b').textContent=r.login;document.getElementById('usuario').value=r.login;setTimeout(()=>view('v-login'),1800);}
    else setTimeout(()=>location.href='index.html',500);
  }catch(e){showErr(REASONS.falha);btn.disabled=false;btn.textContent='Salvar nova senha';}
};
if(resetRoute())openReset(resetRoute());else view('v-login');
window.addEventListener('hashchange',()=>{if(resetRoute())openReset(resetRoute());});
document.getElementById('f-usuario').addEventListener('keydown',e=>{if(e.key==='Enter')window.requestReset();});
document.getElementById('r-senha').addEventListener('keydown',e=>{if(e.key==='Enter')window.confirmReset();});
function showErr(m){const e=document.getElementById('err');e.textContent=m;e.style.display='block';}
document.getElementById('senha').addEventListener('keydown',e=>{if(e.key==='Enter')window.doLogin();});
window.toggleEye=function(){const i=document.getElementById('senha'),b=document.getElementById('eye'),show=i.type==='password';i.type=show?'text':'password';b.setAttribute('aria-pressed',String(show));const t=show?'Ocultar senha':'Mostrar senha';b.setAttribute('aria-label',t);b.title=t;const end=i.value.length;i.focus();try{i.setSelectionRange(end,end);}catch(_){}};
const capsCheck=e=>{const on=e.getModifierState?.('CapsLock');document.getElementById('caps').hidden=!on;};
document.getElementById('senha').addEventListener('keyup',capsCheck);document.getElementById('senha').addEventListener('keydown',capsCheck);
document.getElementById('senha').addEventListener('blur',()=>{document.getElementById('caps').hidden=true;});
document.getElementById('usuario').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('senha').focus();});
</script>
</body>
</html>
