<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#071b2d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<title>Login — Gestão de Atividades PMS</title>
<link rel="icon" href="img/logo_sertania.png">
<link rel="apple-touch-icon" href="img/logo_sertania.png">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{color-scheme:light}
body{min-height:100vh;background:linear-gradient(105deg,#071827 0%,#0a3b38 42%,#eef3f7 42%,#f7f9fb 100%);display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',system-ui,sans-serif;padding:24px;color:#172033}
.card{position:relative;overflow:hidden;background:#fff;border:1px solid #dbe4ec;border-radius:24px;padding:42px 40px;width:100%;max-width:430px;box-shadow:0 30px 80px rgba(6,28,43,.2)}
.card::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:linear-gradient(90deg,#75c044,#16803d,#f5b82e)}
.logo-row{display:flex;align-items:center;justify-content:center;gap:13px;margin-bottom:31px}
.logo-row img{height:58px;object-fit:contain;filter:drop-shadow(0 5px 10px rgba(10,53,52,.16))}
.logo-txt{font-size:12px;font-weight:750;color:#617184;letter-spacing:.8px;text-transform:uppercase;line-height:1.35}
.logo-txt strong{display:block;font-size:18px;color:#18324a;letter-spacing:.1px}
h2{text-align:center;font-size:25px;font-weight:850;color:#142337;margin-bottom:7px;letter-spacing:-.035em}
.sub{text-align:center;font-size:14px;color:#718096;margin-bottom:29px}
.field{margin-bottom:17px;position:relative}
.field label{display:block;font-size:12px;font-weight:750;color:#526174;margin-bottom:7px;letter-spacing:.3px;text-transform:uppercase}
.field input{width:100%;min-height:48px;background:#f8fafc;border:1px solid #cbd7e2;border-radius:11px;color:#172033;padding:12px 15px;font-size:15px;outline:none;transition:border-color .2s,box-shadow .2s,background .2s;letter-spacing:.2px}
.field input:focus{background:#fff;border-color:#16803d;box-shadow:0 0 0 4px rgba(22,128,61,.11)}
.field input::placeholder{color:#9aa8b7;letter-spacing:0}
.btn{width:100%;background:linear-gradient(135deg,#16803d,#0c6741);color:#fff;border:none;border-radius:11px;padding:14px;font-size:15px;font-weight:800;cursor:pointer;margin-top:9px;transition:filter .2s,transform .1s,box-shadow .2s;letter-spacing:.2px;box-shadow:0 10px 23px rgba(22,128,61,.22)}
.btn:hover{filter:brightness(1.06);box-shadow:0 13px 28px rgba(22,128,61,.28)}
.btn:active{transform:scale(.985)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.err{background:#fff1f2;border:1px solid #fecdd3;color:#be123c;border-radius:9px;padding:11px 14px;font-size:13px;text-align:center;margin-top:14px;display:none}
.footer{text-align:center;font-size:11px;color:#94a3b8;margin-top:29px}
@media(max-width:700px){body{background:linear-gradient(180deg,#071827 0,#0a3b38 25%,#eef3f7 25%);padding:18px}.card{padding:34px 25px;border-radius:20px}}
</style>
</head>
<body>
<div class="card">
  <div class="logo-row">
    <img src="img/logo_sertania.png" alt="Logo PMS">
    <div class="logo-txt"><span>Prefeitura Municipal de</span><strong>Sertânia</strong></div>
  </div>
  <h2>Bem-vindo</h2>
  <p class="sub">Sistema de Gestão de Atividades</p>

  <div class="field">
    <label>Usuário</label>
    <input type="text" id="usuario" placeholder="Ex: RCAMPOS" autocomplete="username" autocapitalize="off" spellcheck="false">
  </div>
  <div class="field">
    <label>Senha</label>
    <input type="password" id="senha" placeholder="••••••••" autocomplete="current-password">
  </div>
  <button class="btn" id="btn" onclick="doLogin()">Entrar</button>
  <div style="text-align:center;margin-top:12px"><a href="#" onclick="recuperarSenha();return false;" style="color:#16803d;font-size:13px;font-weight:650;text-decoration:none">🔑 Esqueci minha senha</a></div>
  <div class="err" id="err"></div>
  <div class="footer">Gestão de Atividades PMS &copy; 2026</div>
</div>

<script type="module">
import {loginEmails,signInUsername} from './js/usuario-login.js';
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.49.0';

const SUPABASE_URL = 'https://xwlmpxypjheuhbxyfplo.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh3bG1weHlwamhldWhieHlmcGxvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM5NjQ1OTEsImV4cCI6MjA5OTU0MDU5MX0.ugbn_guMLqk_I9I9OElI_VKAA8pDpW3trVWr1lT9oQU';
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// Se já logado, vai direto para o app
supabase.auth.getSession().then(({ data })=>{ if(data.session) location.href='index.html'; });
supabase.auth.onAuthStateChange((event, session)=>{ if(session) location.href='index.html'; });

// Converte usuário → email interno
function toEmail(user){return loginEmails(user)[0];}

window.doLogin=async function(){
  const user=document.getElementById('usuario').value.trim();
  const pass=document.getElementById('senha').value;
  const btn=document.getElementById('btn');
  const err=document.getElementById('err');
  if(!user||!pass){showErr('Preencha usuário e senha.');return;}
  btn.disabled=true;btn.textContent='Entrando…';err.style.display='none';
  try{
    const { data, error } = await signInUsername(supabase.auth,user,pass);
    if(error) throw error;
    // Aguarda a sessão ser persistida antes de redirecionar
    if(data.session){
      await supabase.auth.setSession({ access_token: data.session.access_token, refresh_token: data.session.refresh_token });
    }
    setTimeout(()=>location.href='index.html', 300);
  }catch(e){
    const msg=e.message||e.code||'';
    const msgs={
      'Invalid login credentials':'Usuário ou senha incorretos.',
      'Email not confirmed':'E-mail não confirmado.',
      'User not found':'Usuário não encontrado.',
      'too-many-requests':'Muitas tentativas. Aguarde alguns minutos.'
    };
    showErr(msgs[msg]||'Erro ao entrar. Tente novamente. ('+msg+')');
    btn.disabled=false;btn.textContent='Entrar';
  }
};

window.recuperarSenha=async function(){
  const user=document.getElementById('usuario').value.trim();
  const err=document.getElementById('err');
  if(!user){showErr('Digite seu usuário para recuperar a senha.');return;}
  try{
    const { error } = await supabase.auth.resetPasswordForEmail(toEmail(user));
    if(error) throw error;
    err.style.color='#34d399';err.style.borderColor='rgba(16,185,129,.3)';err.style.background='rgba(16,185,129,.1)';
    showErr('✅ E-mail de recuperação enviado! Verifique sua caixa de entrada.');
  }catch(e){
    const msg=e.message||e.code||'';
    const msgs={'User not found':'Usuário não encontrado.','too-many-requests':'Muitas tentativas. Aguarde.'};
    showErr(msgs[msg]||'Erro ao enviar e-mail. ('+msg+')');
  }
};
function showErr(m){const e=document.getElementById('err');e.textContent=m;e.style.display='block';}
document.getElementById('senha').addEventListener('keydown',e=>{if(e.key==='Enter')window.doLogin();});
document.getElementById('usuario').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('senha').focus();});
</script>
</body>
</html>
