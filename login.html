<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#3b82f6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<title>Login — Gestão de Atividades PMS</title>
<link rel="icon" href="img/logo_sertania.png">
<link rel="apple-touch-icon" href="img/logo_sertania.png">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:linear-gradient(135deg,#06101f 0%,#0a1830 50%,#06101f 100%);display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',system-ui,sans-serif;padding:20px}
.card{background:linear-gradient(160deg,#1a2540,#111827);border:1px solid rgba(59,130,246,.2);border-radius:20px;padding:40px 36px;width:100%;max-width:400px;box-shadow:0 24px 80px rgba(0,0,0,.6)}
.logo-row{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:30px}
.logo-row img{height:54px;object-fit:contain;filter:drop-shadow(0 0 12px rgba(59,130,246,.4))}
.logo-txt{font-size:13px;font-weight:700;color:#94a3b8;letter-spacing:.8px;text-transform:uppercase;line-height:1.3}
.logo-txt strong{display:block;font-size:17px;color:#e2e8f0;letter-spacing:.2px}
h2{text-align:center;font-size:21px;font-weight:800;color:#f1f5f9;margin-bottom:4px}
.sub{text-align:center;font-size:13px;color:#475569;margin-bottom:28px}
.field{margin-bottom:16px;position:relative}
.field label{display:block;font-size:12px;font-weight:600;color:#94a3b8;margin-bottom:7px;letter-spacing:.3px;text-transform:uppercase}
.field input{width:100%;background:#0f172a;border:1px solid rgba(59,130,246,.2);border-radius:10px;color:#f1f5f9;padding:12px 16px;font-size:14px;outline:none;transition:border-color .2s,box-shadow .2s;letter-spacing:.3px}
.field input:focus{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.15)}
.field input::placeholder{color:#374151;letter-spacing:0}
.btn{width:100%;background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;border:none;border-radius:10px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;margin-top:8px;transition:opacity .2s,transform .1s;letter-spacing:.3px}
.btn:hover{opacity:.9}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.err{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:#f87171;border-radius:8px;padding:10px 14px;font-size:13px;text-align:center;margin-top:14px;display:none}
.footer{text-align:center;font-size:11px;color:#1e293b;margin-top:28px}
@media(max-width:480px){.card{padding:28px 20px}}
</style>
</head>
<body>
<div class="card">
  <div class="logo-row">
    <img src="img/logo_sertania.png" alt="Logo PMS">
    <div class="logo-txt"><span>Prefeitura Municipal de</span><strong>Sertânia</strong></div>
  </div>
  <h2>Bem-vindo</h2>
  <p class="sub">Sistema de Gestão de Atividades</p>

  <div class="field">
    <label>Usuário</label>
    <input type="text" id="usuario" placeholder="Ex: RCAMPOS" autocomplete="username" autocapitalize="off" spellcheck="false">
  </div>
  <div class="field">
    <label>Senha</label>
    <input type="password" id="senha" placeholder="••••••••" autocomplete="current-password">
  </div>
  <button class="btn" id="btn" onclick="doLogin()">Entrar</button>
  <div style="text-align:center;margin-top:12px"><a href="#" onclick="recuperarSenha();return false;" style="color:#3b82f6;font-size:13px;text-decoration:none">🔑 Esqueci minha senha</a></div>
  <div class="err" id="err"></div>
  <div class="footer">Gestão de Atividades PMS &copy; 2026</div>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.49.0';

const SUPABASE_URL = 'https://xwlmpxypjheuhbxyfplo.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh3bG1weHlwamhldWhieHlmcGxvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM5NjQ1OTEsImV4cCI6MjA5OTU0MDU5MX0.ugbn_guMLqk_I9I9OElI_VKAA8pDpW3trVWr1lT9oQU';
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// Se já logado, vai direto para o app
supabase.auth.getSession().then(({ data })=>{ if(data.session) location.href='index.html'; });
supabase.auth.onAuthStateChange((event, session)=>{ if(session) location.href='index.html'; });

// Converte usuário → email interno
// Ex: RCAMPOS → rcampos@pms.sertania
function toEmail(user){return user.trim().toLowerCase()+'@pms.sertania';}

window.doLogin=async function(){
  const user=document.getElementById('usuario').value.trim();
  const pass=document.getElementById('senha').value;
  const btn=document.getElementById('btn');
  const err=document.getElementById('err');
  if(!user||!pass){showErr('Preencha usuário e senha.');return;}
  btn.disabled=true;btn.textContent='Entrando…';err.style.display='none';
  try{
    const { error } = await supabase.auth.signInWithPassword({ email: toEmail(user), password: pass });
    if(error) throw error;
    location.href='index.html';
  }catch(e){
    const msg=e.message||e.code||'';
    const msgs={
      'Invalid login credentials':'Usuário ou senha incorretos.',
      'Email not confirmed':'E-mail não confirmado.',
      'User not found':'Usuário não encontrado.',
      'too-many-requests':'Muitas tentativas. Aguarde alguns minutos.'
    };
    showErr(msgs[msg]||'Erro ao entrar. Tente novamente. ('+msg+')');
    btn.disabled=false;btn.textContent='Entrar';
  }
};

window.recuperarSenha=async function(){
  const user=document.getElementById('usuario').value.trim();
  const err=document.getElementById('err');
  if(!user){showErr('Digite seu usuário para recuperar a senha.');return;}
  try{
    const { error } = await supabase.auth.resetPasswordForEmail(toEmail(user));
    if(error) throw error;
    err.style.color='#34d399';err.style.borderColor='rgba(16,185,129,.3)';err.style.background='rgba(16,185,129,.1)';
    showErr('✅ E-mail de recuperação enviado! Verifique sua caixa de entrada.');
  }catch(e){
    const msg=e.message||e.code||'';
    const msgs={'User not found':'Usuário não encontrado.','too-many-requests':'Muitas tentativas. Aguarde.'};
    showErr(msgs[msg]||'Erro ao enviar e-mail. ('+msg+')');
  }
};
function showErr(m){const e=document.getElementById('err');e.textContent=m;e.style.display='block';}
document.getElementById('senha').addEventListener('keydown',e=>{if(e.key==='Enter')window.doLogin();});
document.getElementById('usuario').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('senha').focus();});
</script>
</body>
</html>
