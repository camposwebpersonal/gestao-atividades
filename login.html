<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login — Gestão de Atividades PMS</title>
<link rel="icon" href="img/logo_sertania.png">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:linear-gradient(135deg,#06101f 0%,#0a1830 50%,#06101f 100%);display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',system-ui,sans-serif;padding:20px}
.login-card{background:linear-gradient(160deg,#1a2540,#111827);border:1px solid rgba(59,130,246,.2);border-radius:20px;padding:40px 36px;width:100%;max-width:400px;box-shadow:0 24px 80px rgba(0,0,0,.6)}
.login-logo{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:32px}
.login-logo img{height:52px;object-fit:contain;filter:drop-shadow(0 0 12px rgba(59,130,246,.4))}
.login-logo-text{font-size:13px;font-weight:700;color:#94a3b8;letter-spacing:.8px;text-transform:uppercase;line-height:1.3}
.login-logo-text strong{display:block;font-size:18px;color:#e2e8f0;letter-spacing:.2px}
h2{text-align:center;font-size:22px;font-weight:800;color:#f1f5f9;margin-bottom:6px}
.login-sub{text-align:center;font-size:13px;color:#64748b;margin-bottom:28px}
.field{margin-bottom:18px}
.field label{display:block;font-size:12px;font-weight:600;color:#94a3b8;margin-bottom:7px;letter-spacing:.3px}
.field input{width:100%;background:#0f172a;border:1px solid rgba(59,130,246,.2);border-radius:10px;color:#f1f5f9;padding:12px 16px;font-size:14px;outline:none;transition:border-color .2s,box-shadow .2s}
.field input:focus{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.15)}
.btn-login{width:100%;background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;border:none;border-radius:10px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;margin-top:8px;transition:opacity .2s,transform .1s;letter-spacing:.3px}
.btn-login:hover{opacity:.9}
.btn-login:active{transform:scale(.98)}
.btn-login:disabled{opacity:.6;cursor:not-allowed}
.error-msg{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:#f87171;border-radius:8px;padding:10px 14px;font-size:13px;text-align:center;margin-top:14px;display:none}
.login-footer{text-align:center;font-size:11px;color:#374151;margin-top:28px}
@media(max-width:480px){.login-card{padding:28px 20px}}
</style>
</head>
<body>
<div class="login-card">
  <div class="login-logo">
    <img src="img/logo_sertania.png" alt="Logo">
    <div class="login-logo-text"><span>Prefeitura Municipal de</span><strong>Sertânia</strong></div>
  </div>
  <h2>Bem-vindo</h2>
  <p class="login-sub">Sistema de Gestão de Atividades</p>
  <div class="field">
    <label>E-mail</label>
    <input type="email" id="email" placeholder="seu@email.com" autocomplete="email">
  </div>
  <div class="field">
    <label>Senha</label>
    <input type="password" id="senha" placeholder="••••••••" autocomplete="current-password">
  </div>
  <button class="btn-login" id="btn-login" onclick="doLogin()">Entrar</button>
  <div class="error-msg" id="error-msg"></div>
  <div class="login-footer">Gestão de Atividades PMS &copy; 2026</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.8.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.8.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBy_k7nY2legV17h53GaU-7-usDvtnOzjs",
  authDomain: "gestao-atividades-26257.firebaseapp.com",
  projectId: "gestao-atividades-26257",
  storageBucket: "gestao-atividades-26257.firebasestorage.app",
  messagingSenderId: "113932809324",
  appId: "1:113932809324:web:b441b9549106822a9cd449"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

onAuthStateChanged(auth, user => {
  if (user) window.location.href = 'index.html';
});

window.doLogin = async function() {
  const email = document.getElementById('email').value.trim();
  const senha = document.getElementById('senha').value;
  const btn = document.getElementById('btn-login');
  const err = document.getElementById('error-msg');
  if (!email || !senha) { showErr('Preencha e-mail e senha.'); return; }
  btn.disabled = true;
  btn.textContent = 'Entrando…';
  err.style.display = 'none';
  try {
    await signInWithEmailAndPassword(auth, email, senha);
    window.location.href = 'index.html';
  } catch(e) {
    const msgs = {
      'auth/invalid-credential': 'E-mail ou senha incorretos.',
      'auth/user-not-found': 'Usuário não encontrado.',
      'auth/wrong-password': 'Senha incorreta.',
      'auth/too-many-requests': 'Muitas tentativas. Aguarde.',
      'auth/invalid-email': 'E-mail inválido.'
    };
    showErr(msgs[e.code] || 'Erro ao entrar. Tente novamente.');
    btn.disabled = false;
    btn.textContent = 'Entrar';
  }
};

function showErr(msg) {
  const el = document.getElementById('error-msg');
  el.textContent = msg;
  el.style.display = 'block';
}

document.getElementById('senha').addEventListener('keydown', e => {
  if (e.key === 'Enter') window.doLogin();
});
</script>
</body>
</html>
