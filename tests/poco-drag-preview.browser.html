<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><link rel="stylesheet" href="../css/prefeitura-shell.css"></head><body><div id="content"></div><pre id="result">WAIT</pre>
<script>
window.S={isAdmin:true,secs:[{id:'s'}],items:[{id:'d',atividade_id:'s',description:'EMPRESA',extra_fields:{registro_tipo:'perfurador'}}],subitems:['A','B','C'].map((id,i)=>({id,atividade_id:'s',item_id:'d',description:'LOCAL '+id,start_date:'2026-09-0'+(i+1),extra_fields:{registro_tipo:'poco',numero:'POÇO '+(i+1),poco_order:i,status_perfuracao:'executada'}}))};
window.toast=()=>{};window.serverTimestamp=()=>'';window.db={};window.doc=(db,col,id)=>({id});window.updateDoc=async(ref,payload)=>Object.assign(S.subitems.find(p=>p.id===ref.id),payload);window.loadData=async()=>{};
</script><script src="../js/perfuracao-pocos.js"></script><script>
const wait=()=>new Promise(resolve=>setTimeout(resolve,220));
const check=(condition,message)=>{if(!condition)throw Error(message);};
const fire=(el,type,transfer,y=0)=>el.dispatchEvent(new DragEvent(type,{bubbles:true,cancelable:true,dataTransfer:transfer,clientY:y}));
(async()=>{try{
 renderPocos('s');await wait();
 let cards=[...document.querySelectorAll('.pw-card')],transfer=new DataTransfer();const originalB=cards[1].offsetTop;
 fire(cards[0].querySelector('.pw-drag-handle'),'dragstart',transfer);await wait();
 check(document.querySelector('.pw-drag-placeholder'),'Espaço inicial ausente');
 fire(cards[2],'dragover',transfer,cards[2].getBoundingClientRect().bottom-5);await wait();
 check(cards[1].offsetTop<originalB-20,'Os cartões não se deslocaram para cima');
 check(document.querySelector('.pw-drag-placeholder').previousElementSibling===cards[2],'Espaço não acompanhou o arraste para baixo');
 check((S.subitems[0].poco_order??S.subitems[0].extra_fields.poco_order)===0,'Salvou antes de soltar');
 fire(cards[1],'dragover',transfer,cards[1].getBoundingClientRect().top+5);await wait();
 check(document.querySelector('.pw-drag-placeholder').nextElementSibling===cards[1],'Espaço não acompanhou o arraste para cima');
 check(cards[1].offsetTop>originalB-5,'Os cartões não voltaram para baixo');
 fire(cards[2],'dragover',transfer,cards[2].getBoundingClientRect().bottom-5);await wait();
 fire(document.querySelector('.pw-drag-placeholder'),'drop',transfer);await wait();
 cards=[...document.querySelectorAll('.pw-card')];check(cards.map(x=>x.dataset.wellId).join(',')==='B,C,A','Ordem final incorreta');
 check(cards.map(x=>x.querySelector('.pw-num').textContent).join(',')==='POÇO 1,POÇO 2,POÇO 3','Numeração incorreta');
 check(!document.querySelector('.pw-drag-placeholder'),'Espaço não removido');
 transfer=new DataTransfer();fire(cards[2].querySelector('.pw-drag-handle'),'dragstart',transfer);await wait();fire(cards[0],'dragover',transfer,cards[0].getBoundingClientRect().top+5);await wait();pocoDragEnd();
 check(!document.querySelector('.pw-drag-placeholder'),'Cancelar deixou espaço aberto');check(!document.querySelector('.pw-drag-source'),'Cancelar deixou cartão invisível');
 check([...document.querySelectorAll('.pw-card')].map(x=>x.dataset.wellId).join(',')==='B,C,A','Cancelar mudou a ordem');
 document.querySelector('#result').textContent='PASS: deslocamento em ambas as direções, espaço, salvamento ao soltar e cancelamento';
}catch(e){document.querySelector('#result').textContent='FAIL: '+e.stack;}})();
</script></body></html>
