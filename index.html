<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gestão de Atividades — PMS</title>
<link rel="icon" href="img/logo_sertania.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
:root{--bg:#080f1e;--card:#0e1729;--border:#1e3a5f;--text:#e2e8f0;--muted:#64748b;--dim:#374151;--accent:#3b82f6;--h:58px}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;font-size:14px}
#app{display:flex;flex-direction:column;height:100%}
#navbar{height:var(--h);background:linear-gradient(90deg,#06101f,#0a1830);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;padding:0 20px;flex-shrink:0;position:sticky;top:0;z-index:100}
.brand{font-size:16px;font-weight:800;color:#e2e8f0;display:flex;align-items:center;gap:8px}
.brand img{height:30px;object-fit:contain}
.spacer{flex:1}
.user-chip{display:flex;align-items:center;gap:8px;background:#0e1729;border:1px solid var(--border);border-radius:20px;padding:5px 14px 5px 8px}
.user-chip .av{width:26px;height:26px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0}
.user-chip span{font-size:12px;font-weight:600;color:#94a3b8}
.btn-logout{background:rgba(239,68,68,.12);color:#f87171;border:1px solid rgba(239,68,68,.25);border-radius:8px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer}
.btn-logout:hover{background:rgba(239,68,68,.22)}
#navmenu{background:#060e1c;border-bottom:1px solid var(--border);display:flex;gap:2px;padding:0 16px;overflow-x:auto;flex-shrink:0;scrollbar-width:none}
.nav-btn{background:none;border:none;color:var(--muted);font-size:13px;font-weight:600;padding:10px 16px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:color .15s,border-color .15s}
.nav-btn:hover{color:var(--text)}
.nav-btn.active{color:var(--accent);border-bottom-color:var(--accent)}
main{flex:1;overflow-y:auto}
#content{padding:clamp(14px,2.5vw,36px)}
.page-title{font-size:clamp(18px,2.2vw,28px);font-weight:800;margin-bottom:4px}
.page-sub{font-size:13px;color:var(--muted);margin-bottom:20px}
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.activity-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;cursor:pointer;transition:border-color .2s,box-shadow .2s;overflow:hidden}
.activity-card:hover{border-color:var(--accent);box-shadow:0 4px 24px rgba(59,130,246,.12)}
.card-thumb{width:100%;height:130px;object-fit:cover;border-radius:8px;margin-bottom:12px;display:block}
.card-thumb-ph{width:100%;height:130px;border-radius:8px;margin-bottom:12px;background:linear-gradient(135deg,#0a1222,#0e1a2e);display:flex;align-items:center;justify-content:center;font-size:36px;color:#1e3a5f}
.card-title{font-size:15px;font-weight:700;margin-bottom:6px}
.card-obs{font-size:12px;color:var(--muted);line-height:1.5;margin-bottom:10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-foot{display:flex;align-items:center;gap:8px}
.prog-bar{height:5px;background:#1e3a5f;border-radius:3px;overflow:hidden;flex:1}
.prog-fill{height:100%;border-radius:3px;transition:width .4s}
.card-btns{display:flex;gap:5px}
.card-btn{background:none;border:1px solid var(--border);color:var(--muted);border-radius:7px;padding:5px 9px;font-size:11px;cursor:pointer;transition:all .15s}
.card-btn:hover{border-color:var(--accent);color:var(--accent)}
.stats-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 18px;min-width:100px;flex:1}
.stat-val{font-size:24px;font-weight:800;line-height:1}
.stat-lbl{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px;margin-top:4px}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:1000;align-items:center;justify-content:center;padding:20px}
.modal-box{width:100%;max-width:680px;max-height:90vh;overflow-y:auto;background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:18px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--card);z-index:1}
.modal-title{font-size:16px;font-weight:800}
.modal-close{background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer}
.modal-body{padding:20px}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;padding-top:14px;border-top:1px solid var(--border)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-group{display:flex;flex-direction:column;gap:5px}
.form-group.full{grid-column:1/-1}
.form-group label{font-size:12px;font-weight:600;color:var(--muted)}
.form-group input,.form-group textarea,.form-group select{background:#0f172a;border:1px solid var(--border);border-radius:8px;color:var(--text);padding:9px 12px;font-size:13px;font-family:inherit;outline:none;transition:border-color .15s}
.form-group input:focus,.form-group textarea:focus,.form-group select:focus{border-color:var(--accent)}
.form-group textarea{resize:vertical;min-height:70px}
.form-group select option{background:#0f172a}
.btn-save{background:var(--accent);color:#fff;border:none;border-radius:9px;padding:10px 22px;font-size:13px;font-weight:700;cursor:pointer;transition:background .15s}
.btn-save:hover{background:#2563eb}
.btn-cancel{background:var(--card);color:var(--muted);border:1px solid var(--border);border-radius:9px;padding:10px 18px;font-size:13px;font-weight:600;cursor:pointer}
.btn-action{background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:9px;padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;white-space:nowrap}
.btn-action:hover{border-color:var(--accent);color:var(--accent)}
.btn-action.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-action.primary:hover{background:#2563eb;border-color:#2563eb}
.item-row{background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:10px;overflow:hidden}
.item-header{display:flex;align-items:center;gap:10px;padding:12px 16px;cursor:pointer;user-select:none}
.item-header:hover{background:rgba(255,255,255,.02)}
.item-info{flex:1;min-width:0}
.item-name{font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.item-meta{font-size:11px;color:var(--muted);margin-top:2px}
.item-body{padding:0 16px 14px;border-top:1px solid var(--border)}
.sub-row{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;background:#0a1222;margin-bottom:6px}
.badge{font-size:11px;border-radius:6px;padding:2px 7px;font-weight:600}
.badge-green{background:rgba(16,185,129,.12);color:#34d399}
.badge-blue{background:rgba(59,130,246,.12);color:#60a5fa}
.badge-red{background:rgba(239,68,68,.12);color:#f87171}
.badge-gray{background:#1e2d47;color:#64748b}
.pring{display:inline-flex;align-items:center;justify-content:center;position:relative;flex-shrink:0}
.pring svg{transform:rotate(-90deg)}
.pring-txt{position:absolute;font-size:9px;font-weight:800}
.resp-section{background:#0a1222;border-radius:10px;padding:12px;margin-top:10px;border:1px solid var(--border)}
.resp-section h5{font-size:12px;font-weight:700;color:#818cf8;margin-bottom:10px}
.resp-circle{width:52px;height:52px;border-radius:50%;border:2px solid #818cf8;overflow:hidden;background:#1e3a5f;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:22px;cursor:pointer}
.resp-circle img{width:100%;height:100%;object-fit:cover}
.img-section{background:#0a1222;border-radius:10px;padding:12px;margin-top:10px;border:1px solid var(--border)}
.img-section h5{font-size:12px;font-weight:700;color:#a78bfa;margin-bottom:8px}
.img-rep-preview{max-height:110px;max-width:100%;border-radius:6px;object-fit:contain;display:block;margin:8px 0;background:transparent}
.gal-grid{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.gal-thumb{height:54px;border-radius:6px;cursor:pointer;object-fit:cover;border:2px solid transparent;transition:border-color .15s}
.gal-thumb:hover{border-color:var(--accent)}
#gallery-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:2000;align-items:center;justify-content:center;padding:16px}
.gal-modal-box{background:#0e1729;border:1px solid var(--border);border-radius:16px;width:100%;max-width:760px;max-height:92vh;overflow-y:auto;padding:22px}
#lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:3000;align-items:center;justify-content:center;cursor:zoom-out}
#lightbox img{max-width:96vw;max-height:96vh;object-fit:contain;border-radius:6px}
#toast{position:fixed;bottom:24px;right:24px;z-index:9999;display:flex;flex-direction:column;gap:8px}
.toast-item{padding:11px 16px;border-radius:10px;font-size:13px;font-weight:600;box-shadow:0 8px 28px rgba(0,0,0,.4);animation:tIn .2s ease;max-width:300px}
.toast-item.success{background:#064e3b;color:#34d399;border:1px solid #065f46}
.toast-item.error{background:#450a0a;color:#f87171;border:1px solid #7f1d1d}
.toast-item.info{background:#0c1a3a;color:#60a5fa;border:1px solid #1e3a5f}
@keyframes tIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.loading{display:flex;align-items:center;justify-content:center;padding:60px;color:var(--muted);gap:10px}
.spinner{width:22px;height:22px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:50px;color:var(--muted)}
@media(max-width:768px){.form-grid{grid-template-columns:1fr}.form-group.full{grid-column:1}.cards-grid{grid-template-columns:1fr}.stats-row{gap:8px}}
@media(max-width:600px){.modal-overlay{padding:0;align-items:flex-end}.modal-box{border-radius:16px 16px 0 0;max-height:93vh;max-width:100%}}
</style>
</head>
<body>
<div id="app">
  <nav id="navbar">
    <div class="brand"><img src="img/logo_sertania.png" alt=""> <span>GESTÃO PMS</span></div>
    <div class="spacer"></div>
    <div class="user-chip"><div class="av" id="u-av">?</div><span id="u-name">…</span></div>
    <button class="btn-logout" onclick="doLogout()">Sair</button>
  </nav>
  <div id="navmenu">
    <button class="nav-btn active" id="nav-dash" onclick="setView('dash')">📊 Dashboard</button>
    <button class="nav-btn" id="nav-ativ" onclick="setView('ativ')">📅 Atividades</button>
    <button class="nav-btn" id="nav-adm" style="display:none" onclick="setView('adm')">⚙️ Admin</button>
  </div>
  <main><div id="content"><div class="loading"><div class="spinner"></div> Carregando…</div></div></main>
</div>
<div class="modal-overlay" id="modal-ov" onclick="if(event.target===this)closeModal()">
  <div class="modal-box">
    <div class="modal-head">
      <div><div class="modal-title" id="modal-ttl"></div><div style="font-size:12px;color:var(--muted);margin-top:3px" id="modal-sub"></div></div>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>
<div id="gallery-modal" onclick="if(event.target===this)closeGal()">
  <div class="gal-modal-box" id="gal-box"></div>
</div>
<div id="lightbox" onclick="document.getElementById('lightbox').style.display='none'">
  <img id="lb-img" src="" alt="">
</div>
<div id="toast"></div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/11.8.1/firebase-app.js";
import{getAuth,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/11.8.1/firebase-auth.js";
import{getFirestore,collection,doc,addDoc,updateDoc,deleteDoc,getDocs,query,where,orderBy,serverTimestamp}from"https://www.gstatic.com/firebasejs/11.8.1/firebase-firestore.js";

const FB={apiKey:"AIzaSyBy_k7nY2legV17h53GaU-7-usDvtnOzjs",authDomain:"gestao-atividades-26257.firebaseapp.com",projectId:"gestao-atividades-26257",storageBucket:"gestao-atividades-26257.firebasestorage.app",messagingSenderId:"113932809324",appId:"1:113932809324:web:b441b9549106822a9cd449"};
const fbApp=initializeApp(FB);
const auth=getAuth(fbApp);
const db=getFirestore(fbApp);

// ── IMGBB KEY (configure após receber) ──
let IMGBB_KEY="3a90ee7b8bd151de3ee963963bb61e83";

// ── STATE ──
let S={user:null,isAdmin:false,secs:[],items:[],subitems:[]};
let curSecId=null,_pRT={};

// ── AUTH ──
onAuthStateChanged(auth,async u=>{
  if(!u){location.href='login.html';return;}
  S.user=u;
  const ini=(u.displayName||u.email||'?').split(' ').map(w=>w[0]).join('').substring(0,2).toUpperCase();
  document.getElementById('u-av').textContent=ini;
  document.getElementById('u-name').textContent=u.displayName||u.email.split('@')[0];
  try{
    const {getDoc}=await import("https://www.gstatic.com/firebasejs/11.8.1/firebase-firestore.js");
    const ud=await getDoc(doc(db,'users',u.uid));
    if(ud.exists()){S.isAdmin=ud.data().role==='admin'||ud.data().isAdmin===true;}
    else{S.isAdmin=true;} // primeiro usuário = admin
  }catch(e){S.isAdmin=true;}
  if(S.isAdmin)document.getElementById('nav-adm').style.display='';
  await loadData();
  setView('dash');
});
window.doLogout=()=>signOut(auth).then(()=>location.href='login.html');

// ── DATA ──
async function loadData(){
  const[a,b,c]=await Promise.all([
    getDocs(query(collection(db,'secretariats'),orderBy('order_num','asc'))),
    getDocs(query(collection(db,'items'),orderBy('order_num','asc'))),
    getDocs(query(collection(db,'subitems'),orderBy('order_num','asc')))
  ]);
  S.secs=a.docs.map(d=>({id:d.id,...d.data()}));
  S.items=b.docs.map(d=>({id:d.id,...d.data()}));
  S.subitems=c.docs.map(d=>({id:d.id,...d.data()}));
}

// ── UTILS ──
const esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const fmtD=d=>{if(!d)return'—';try{return new Date(d+'T00:00').toLocaleDateString('pt-BR');}catch{return d;}};
function toast(msg,type='success',dur=3200){const el=document.createElement('div');el.className='toast-item '+type;el.textContent=msg;document.getElementById('toast').appendChild(el);setTimeout(()=>el.remove(),dur);}
const setC=h=>document.getElementById('content').innerHTML=h;
const pColor=p=>p===100?'#10b981':p>0?'#3b82f6':'#334155';
function pRing(p,sz=36){const r=sz/2-4,c=2*Math.PI*r,f=c-(p/100)*c,col=pColor(p);
  return`<div class="pring" style="width:${sz}px;height:${sz}px"><svg width="${sz}" height="${sz}"><circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="#1e3a5f" stroke-width="3.5"/><circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="${col}" stroke-width="3.5" stroke-dasharray="${c}" stroke-dashoffset="${f}" stroke-linecap="round"/></svg><span class="pring-txt" style="color:${col}">${p}%</span></div>`;}
function iProg(item){const subs=S.subitems.filter(s=>s.item_id===item.id);if(!subs.length)return{hasSubs:false,pct:item.concluded==1?100:0,total:0,subs:[]};const done=subs.filter(s=>s.concluded==1).length;return{hasSubs:true,total:subs.length,concluded:done,pct:Math.round((done/subs.length)*100),subs};}

// ── NAV ──
window.setView=function(v){
  ['dash','ativ','adm'].forEach(k=>{const b=document.getElementById('nav-'+k);if(b)b.classList.toggle('active',k===v);});
  if(v==='dash'||v==='ativ')renderDash();
  else if(v==='adm')renderAdmin();
};

// ── DASHBOARD ──
function renderDash(){
  const total=S.secs.length;
  const prgs=S.secs.map(s=>{const its=S.items.filter(i=>i.atividade_id===s.id);if(!its.length)return 0;const d=its.filter(i=>iProg(i).pct===100).length;return Math.round(d/its.length*100);});
  const done=prgs.filter(p=>p===100).length;
  const avg=total?Math.round(prgs.reduce((a,b)=>a+b,0)/total):0;
  const cards=S.secs.map((s,i)=>{
    const p=prgs[i],col=pColor(p);
    return`<div class="activity-card" onclick="openActivity('${s.id}')">
      ${s.cover_url?`<img class="card-thumb" src="${esc(s.cover_url)}" loading="lazy" alt="">`:`<div class="card-thumb-ph">📅</div>`}
      <div class="card-title">${esc(s.name)}</div>
      ${s.observacoes?`<div class="card-obs">${esc(s.observacoes)}</div>`:''}
      <div class="card-foot">
        <div style="flex:1"><div style="font-size:11px;color:${col};font-weight:700;margin-bottom:3px">${p}% concluído</div><div class="prog-bar"><div class="prog-fill" style="width:${p}%;background:${col}"></div></div></div>
        <div class="card-btns">
          ${S.isAdmin?`<button class="card-btn" onclick="event.stopPropagation();openSecModal('${s.id}')">✏️</button>`:''}
          <button class="card-btn" onclick="event.stopPropagation();gerarPdf('${s.id}')">📄</button>
        </div>
      </div>
    </div>`;
  }).join('')||'<div class="empty">Nenhuma atividade cadastrada.</div>';
  setC(`<div class="page-title">📊 Dashboard</div>
    <div class="page-sub">Visão geral das atividades da Prefeitura</div>
    <div class="stats-row">
      <div class="stat-card"><div class="stat-val">${total}</div><div class="stat-lbl">Total</div></div>
      <div class="stat-card"><div class="stat-val" style="color:#34d399">${done}</div><div class="stat-lbl">Concluídas</div></div>
      <div class="stat-card"><div class="stat-val" style="color:#f59e0b">${total-done}</div><div class="stat-lbl">Em andamento</div></div>
      <div class="stat-card"><div class="stat-val" style="color:var(--accent)">${avg}%</div><div class="stat-lbl">Progresso geral</div></div>
    </div>
    ${S.isAdmin?`<div style="margin-bottom:18px"><button class="btn-action primary" onclick="openSecModal()">+ Nova Atividade</button></div>`:''}
    <div class="cards-grid">${cards}</div>`);
}

// ── ACTIVITY DETAIL ──
window.openActivity=function(secId){
  curSecId=secId;
  const sec=S.secs.find(s=>s.id===secId);if(!sec)return;
  const items=S.items.filter(i=>i.atividade_id===secId);
  const today=new Date();today.setHours(0,0,0,0);
  const itemsHtml=items.map(item=>renderItem(item,today)).join('')||'<div class="empty">Nenhum item. Clique em "+ Item" para adicionar.</div>';
  setC(`<div style="display:flex;align-items:center;gap:10px;margin-bottom:16px">
    <button class="btn-action" onclick="setView('dash')">← Voltar</button>
    <div style="flex:1"></div>
    ${S.isAdmin?`<button class="btn-action" onclick="openItemModal(null,'${secId}',false,null)">+ Item</button>`:''}
    ${S.isAdmin?`<button class="btn-action" onclick="openSecModal('${secId}')">✏️ Editar</button>`:''}
    <button class="btn-action" onclick="abrirBusca('${secId}')">🔍 Buscar</button>
    <button class="btn-action" onclick="gerarPdf('${secId}')">📄 PDF</button>
  </div>
  <div style="margin-bottom:18px">
    ${sec.cover_url?`<img src="${esc(sec.cover_url)}" style="max-height:80px;max-width:260px;border-radius:10px;object-fit:contain;margin-bottom:10px;cursor:pointer;display:block;background:transparent" onclick="openGal('activity','${secId}','${esc(sec.name)}')" loading="lazy">`:''}
    <div class="page-title">${esc(sec.name)}</div>
    <div class="page-sub">${esc(sec.observacoes||'Detalhes e progresso da atividade')}</div>
    ${sec.responsaveis?`<div style="font-size:13px;color:#818cf8;display:flex;align-items:center;gap:6px;margin-top:-8px;margin-bottom:10px">
      ${sec.resp_url?`<img src="${esc(sec.resp_url)}" style="width:26px;height:26px;border-radius:50%;object-fit:cover;border:2px solid #818cf8">`:''}
      👤 ${esc(sec.responsaveis)}</div>`:''}
  </div>
  <div id="items-cnt">${itemsHtml}</div>`);
};

function renderItem(item,today){
  const pr=iProg(item),col=pColor(pr.pct),done=pr.pct===100;
  const late=!done&&item.deadline_date&&new Date(item.deadline_date)<today;

      ${S.isAdmin?`<button class="card-btn" onclick="toggleDone('subitem','${s.id}',${sD?0:1})">${sD?'↺':'✓'}</button>`:''}
    </div>`;
  }).join(''):'';
  return`<div class="item-row" id="ir-${item.id}">
    <div class="item-header" onclick="togItem('${item.id}')">
      <span style="font-size:20px;flex-shrink:0">${/^\?+$/.test(item.item_icon||'')?'📋':esc(item.item_icon||'📋')}</span>

        </div>

      </div>

      ${item.cover_url?`<img src="${esc(item.cover_url)}" style="height:32px;max-width:48px;object-fit:contain;border-radius:5px;flex-shrink:0;background:transparent;cursor:pointer" onclick="event.stopPropagation();openGal('item','${item.id}','${esc(item.description)}')" loading="lazy">`:''}
      ${pRing(pr.pct)}
      <span id="chev-${item.id}" style="color:var(--muted);font-size:11px;transition:transform .2s;flex-shrink:0">▶</span>
      ${S.isAdmin?`<button class="card-btn" style="margin-left:4px" onclick="event.stopPropagation();openItemModal('${item.id}','${item.atividade_id}',false,null)">✏️</button>`:''}

      ${S.isAdmin?`<button class="card-btn" onclick="event.stopPropagation();openItemModal(null,'${item.atividade_id}',true,'${item.id}')">+ Sub</button>`:''}
    </div>

      ${item.observacao?`<div style="font-size:12px;color:var(--muted);padding:8px 10px;background:#0a1222;border-radius:6px;margin:8px 0">${esc(item.observacao)}</div>`:''}

async function saveRT(type,id){

// ── IMGBB ──
async function imgbbUp(dataUrl){
  if(!IMGBB_KEY||IMGBB_KEY.includes('COLOQUE')){toast('Configure a chave ImgBB em js/firebase-init.js','error');return null;}
  try{const b64=dataUrl.split(',')[1];const fd=new FormData();fd.append('key',IMGBB_KEY);fd.append('image',b64);const r=await fetch('https://api.imgbb.com/1/upload',{method:'POST',body:fd});const j=await r.json();return j.success?j.data.url:null;}catch(e){console.error(e);return null;}
}

// ── THUMB ──
async function mkThumb(dataUrl,w,h,q){return new Promise(res=>{const img=new Image();img.onload=()=>{const ar=img.naturalWidth/img.naturalHeight;let cw=w,ch=h;if(ar>1)ch=Math.round(w/ar);else cw=Math.round(h*ar);const c=document.createElement('canvas');c.width=cw;c.height=ch;c.getContext('2d').drawImage(img,0,0,cw,ch);res(c.toDataURL('image/jpeg',q));};img.src=dataUrl;});}

window.gerarPdf=async function(secId){
  const sec=S.secs.find(s=>s.id===secId);if(!sec)return;
  if(!window.jspdf?.jsPDF){toast('jsPDF não carregado','error');return;}
  toast('Gerando PDF\u2026','info',8000);
  const{jsPDF}=window.jspdf;
  const doc=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
  const W=210,H=297,mx=14,cw=W-mx*2;
  const HDR_H=32,FTR_Y=281,FTR_H=16,BODY_TOP=HDR_H+6,BODY_BOT=FTR_Y-4;
  const sf=(sz,bold,clr)=>{doc.setFontSize(sz||9);doc.setFont('helvetica',bold?'bold':'normal');const c=clr||[26,32,44];doc.setTextColor(c[0],c[1],c[2]);};
  const lhf=pt=>(pt||9)*0.3528*1.5;
  const now=new Date().toLocaleDateString('pt-BR');
  const today=new Date();today.setHours(0,0,0,0);

  const lObj=await loadB64('img/logo_sertania.png','png',120);
  const logo=lObj?lObj.d:null;
  function lSize(obj,maxW,maxH){if(!obj)return null;const ar=obj.w/obj.h;let w=maxW,h=maxW/ar;if(h>maxH){h=maxH;w=maxH*ar;}return{data:obj.d,w,h};}

  function bgTextura(){
    doc.setFillColor(215,242,215);
    for(let gx=14;gx<=196;gx+=7)for(let gy=HDR_H+4;gy<=FTR_Y-2;gy+=7)doc.circle(gx,gy,0.22,'F');
  }

  function cabecalho(){
    bgTextura();
    doc.setFillColor(245,252,245);doc.rect(0,0,W,HDR_H,'F');
    doc.setFillColor(20,82,20);doc.rect(0,0,6,HDR_H,'F');
    doc.setFillColor(110,192,46);doc.rect(0,HDR_H-3,W,3,'F');
    if(logo&&lObj){const ls=lSize(lObj,22,24);if(ls)doc.addImage(ls.data,'PNG',W-mx-ls.w,3+(24-ls.h)/2,ls.w,ls.h,'logo_hdr','FAST');}
    sf(13,true,[20,82,20]);doc.text('RELATORIO DE ATIVIDADE',mx+10,14);
    sf(7,false,[30,123,30]);doc.text('Prefeitura de Sertania \u2014 PE  \u2022  Controle PMS  \u2022  '+now,mx+10,23);
  }

  function rodape(){
    doc.setFillColor(20,82,20);doc.rect(0,FTR_Y,W,FTR_H,'F');
    doc.setFillColor(110,192,46);doc.rect(0,FTR_Y,W,2,'F');
    if(logo&&lObj){const ls=lSize(lObj,14,11);if(ls)doc.addImage(ls.data,'PNG',mx,FTR_Y+2+(11-ls.h)/2,ls.w,ls.h,'logo_ftr','FAST');}
    sf(7,true,[185,245,185]);doc.text('PREFEITURA MUNICIPAL DE SERTANIA \u2014 PE',mx+16,FTR_Y+7);
    sf(6.5,false,[180,240,180]);doc.text('Sert\u00e2nia \u2014 PE  |  (87) 3841-1156  |  www.sertania.pe.gov.br',W/2,FTR_Y+13,{align:'center'});
  }

  let y=BODY_TOP,pageNum=1;
  const chk=n=>{if(y+n>BODY_BOT){rodape();doc.addPage();pageNum++;cabecalho();y=BODY_TOP;}};

  cabecalho();

  // ── Stats ──
  const items=S.items.filter(i=>i.atividade_id===secId);
  const itemProgs=items.map(item=>({item,prog:iProg(item)}));
  const totalItems=items.length;
  const concludedItems=itemProgs.filter(({prog,item})=>prog.hasSubs?prog.pct===100:item.concluded==1).length;
  const overdueCount=itemProgs.filter(({item,prog})=>{
    if(prog.hasSubs)return prog.subs.some(s=>!s.concluded&&s.deadline_date&&new Date(s.deadline_date)<today);
    return !item.concluded&&item.deadline_date&&new Date(item.deadline_date)<today;
  }).length;
  const pendingItems=totalItems-concludedItems-overdueCount;
  const pctGeral=totalItems>0?Math.round((concludedItems/totalItems)*100):0;
  const allSubs=S.subitems.filter(s=>items.some(i=>i.id===s.item_id));
  const subTotal=allSubs.length,subConc=allSubs.filter(s=>s.concluded==1).length;

  // ── Cover image ──
  let covD=null;
  if(sec.cover_url){try{covD=await loadB64(sec.cover_url,'jpeg',450);}catch(e){}}

  // ── Title block ──
  doc.setFillColor(13,34,64);doc.rect(mx,y,cw,0.7,'F');y+=3;
  sf(15,true,[13,34,64]);doc.text(sec.name||'ATIVIDADE',mx,y+8);
  let titleBot=y+13;
  if(covD){
    const covW=58,covMaxH=44,ar=covD.w/covD.h;
    let iW=covW,iH=covW/ar;if(iH>covMaxH){iH=covMaxH;iW=covMaxH*ar;}
    try{doc.addImage(covD.d,'JPEG',W-mx-iW,y-2,iW,iH);}catch(e){}
    titleBot=Math.max(titleBot,y-2+iH+2);
  }
  y=titleBot;

  // ── Responsáveis ──
  if(sec.responsaveis){
    chk(10);
    const rL=doc.splitTextToSize(sec.responsaveis,cw-38);
    const rH=Math.max(8,rL.length*lhf(8)+4);
    doc.setFillColor(235,240,255);doc.rect(mx,y,cw,rH,'F');
    doc.setFillColor(99,102,241);doc.rect(mx,y,2.5,rH,'F');
    sf(7.5,true,[67,56,202]);doc.text('Responsaveis:',mx+5,y+5);
    sf(7.5,false,[30,30,80]);doc.text(rL,mx+36,y+5);
    y+=rH+2;
  }

  // ── Observações ──
  if(sec.observacoes){
    chk(12);
    const oL=doc.splitTextToSize(sec.observacoes,cw-8);
    const oH=Math.max(10,oL.length*lhf(8)+6);
    doc.setFillColor(255,249,230);doc.setDrawColor(245,158,11);doc.setLineWidth(0.2);doc.rect(mx,y,cw,oH,'FD');
    doc.setFillColor(245,158,11);doc.rect(mx,y,2.5,oH,'F');
    sf(7.5,true,[146,64,14]);doc.text('Observacoes:',mx+5,y+5);
    sf(7.5,false,[100,60,10]);doc.text(oL,mx+5,y+5+lhf(7.5));
    y+=oH+3;
  }

  y+=2;

  // ── Stats boxes ──
  chk(18);
  const cw4=(cw-9)/4;
  [{v:String(totalItems),l:'Total Itens',c:[59,130,246]},{v:String(concludedItems),l:'Concluidos',c:[16,185,129]},{v:String(pendingItems),l:'Pendentes',c:[96,165,250]},{v:String(overdueCount),l:'Atrasados',c:[239,68,68]}].forEach((card,i)=>{
    const cx=mx+i*(cw4+3);
    doc.setFillColor(248,250,252);doc.setDrawColor(215,225,235);doc.setLineWidth(0.2);doc.roundedRect(cx,y,cw4,15,2,2,'FD');
    doc.setFillColor(...card.c);doc.roundedRect(cx,y,cw4,2.5,1,1,'F');
    sf(11,true,card.c);doc.text(card.v,cx+cw4/2,y+9,{align:'center'});
    sf(6.5,false,[100,116,139]);doc.text(card.l,cx+cw4/2,y+13,{align:'center'});
  });
  y+=19;

  // ── Sub-itens ──
  if(subTotal>0){
    chk(7);sf(8,true,[40,60,90]);
    doc.text('Sub-itens: '+subConc+'/'+subTotal+' concluidos ('+Math.round(subConc/subTotal*100)+'%)',mx,y+5);
    y+=8;
  }

  // ── Progresso geral ──
  chk(13);
  const barClr=pctGeral===100?[16,185,129]:[59,130,246];
  doc.setFillColor(200,215,235);doc.roundedRect(mx,y,cw,8,2,2,'F');
  if(pctGeral>0){doc.setFillColor(...barClr);doc.roundedRect(mx,y,cw*pctGeral/100,8,2,2,'F');}
  const barTxtClr=pctGeral<15?[30,50,90]:[255,255,255];
  sf(8,true,barTxtClr);doc.text('Progresso Geral: '+pctGeral+'%',W/2,y+5.5,{align:'center'});
  y+=13;

  // ── Ranking ──
  if(itemProgs.length>0){
    chk(14);
    doc.setFillColor(20,82,20);doc.roundedRect(mx,y,cw,8,2,2,'F');
    sf(9,true,[255,255,255]);doc.text('RANKING DE PROGRESSO POR ITEM',mx+5,y+5.5);
    y+=11;
    const rBW=60,rLW=cw-rBW-16;
    itemProgs.forEach(({item,prog})=>{
      chk(8);
      const pct=prog.hasSubs?prog.pct:(item.concluded==1?100:0);
      const isDone=pct===100;
      const rC=isDone?[16,185,129]:(pct>50?[59,130,246]:(pct>0?[245,158,11]:[200,60,60]));

      doc.setFillColor(245,248,252);doc.rect(mx,y,cw,7,'F');

      const bx=mx+rLW+4;

      sf(7,true,isDone?[10,120,80]:[30,40,60]);doc.text(pct+'%',bx+rBW+3,y+4.8);
      y+=7;
    });
    y+=3;
  }

  y+=3;

  // ── Tabela de itens ──
  chk(12);
  doc.setFillColor(20,82,20);doc.roundedRect(mx,y,cw,9,2,2,'F');
  sf(10,true,[255,255,255]);doc.text('ITENS DA ATIVIDADE',mx+5,y+6.5);
  y+=13;

  const tblH=[['#','Item / Observa\u00e7\u00e3o / Respons\u00e1veis','Subs','Prog.','Status','Prazo / Conclus\u00e3o']];
  const tblB=[];const tblE=[];
  let rowNum=0;
  for(let ii=0;ii<items.length;ii++){
    const item=items[ii];const pr=itemProgs[ii].prog;
    const done=pr.hasSubs?(pr.pct===100):(item.concluded==1);
    const late=!done&&item.deadline_date&&new Date(item.deadline_date)<today;
    const st=done?'\u2713 Conclu\u00eddo':late?'\u26a0 Atrasado':'Pendente';
    rowNum++;
    let cell1=item.description;
    if(item.observacao)cell1+='\nObs: '+item.observacao;
    if(item.responsaveis)cell1+='\nResp: '+item.responsaveis;
    const pct=pr.hasSubs?pr.pct:(item.concluded==1?100:0);
    const subCnt=pr.hasSubs?(pr.subs.filter(s=>s.concluded==1).length+'/'+pr.total):'—';
    tblB.push([String(rowNum),cell1,subCnt,pct+'%',st,item.deadline_date?fmtD(item.deadline_date):'\u2014']);
    tblE.push({cu:item.cover_url,ru:item.resp_url});
    if(pr.hasSubs){for(const s of pr.subs){const sD=s.concluded==1;const sL=!sD&&s.deadline_date&&new Date(s.deadline_date)<today;let sc='\u203a '+s.description;if(s.responsaveis)sc+='\nResp: '+s.responsaveis;tblB.push(['',sc,'',sD?'100%':'0%',sD?'\u2713 Conclu\u00eddo':sL?'\u26a0 Atrasado':'Pendente',s.deadline_date?fmtD(s.deadline_date):'\u2014']);tblE.push({cu:null,ru:null});}}
  }
  const iDims=[];
  for(const e of tblE){
    const cd=e.cu?await loadB64(e.cu,'jpeg',150).catch(()=>null):null;
    const rd=e.ru?await loadB64(e.ru,'jpeg',120).catch(()=>null):null;
    iDims.push({cd,rd});
  }
  doc.autoTable({startY:y,head:tblH,body:tblB,
    margin:{left:mx,right:mx,top:BODY_TOP,bottom:H-FTR_Y+4},
    rowPageBreak:'avoid',
    styles:{fontSize:8,cellPadding:1.8,overflow:'linebreak',textColor:[26,32,44],lineColor:[200,225,200],lineWidth:0.1},
    headStyles:{fillColor:[13,34,64],textColor:[255,255,255],fontStyle:'bold',fontSize:7.5},
    alternateRowStyles:{fillColor:[248,252,248]},
    columnStyles:{0:{cellWidth:8,halign:'center'},2:{cellWidth:14,halign:'center'},3:{cellWidth:14,halign:'center'},4:{cellWidth:20},5:{cellWidth:28}},
    didDrawCell:function(dat){
      if(dat.section!=='body'||dat.column.index!==1)return;
      const e=iDims[dat.row.index];if(!e)return;
      if(e.cd){const ih=Math.min(dat.cell.height-1.5,10),iw=ih*(e.cd.w/e.cd.h);try{doc.addImage(e.cd.d,'JPEG',dat.cell.x+dat.cell.width-iw-2,dat.cell.y+(dat.cell.height-ih)/2,iw,ih);}catch(er){}}
      if(e.rd){const rs=Math.min(dat.cell.height-1.5,9),rw=rs*(e.rd.w/e.rd.h),off=e.cd?Math.min(dat.cell.height-1.5,10)*(e.cd.w/e.cd.h)+2:0;try{doc.addImage(e.rd.d,'JPEG',dat.cell.x+dat.cell.width-rw-off-2,dat.cell.y+(dat.cell.height-rs)/2,rw,rs);}catch(er){}}
    },
    didDrawPage:data=>{if(data.pageNumber>1){cabecalho();pageNum=data.pageNumber;}rodape();}
  });

  // ── Prazos de entrega ──
  const dlE=[];
  itemProgs.forEach(({item,prog})=>{
    if(prog.hasSubs){prog.subs.filter(s=>s.deadline_date).forEach(s=>{const iD=s.concluded==1,iOv=!iD&&new Date(s.deadline_date)<today;dlE.push({label:item.description+' > '+s.description,isDone:iD,isOver:iOv,deadline:s.deadline_date,conclusion_date:s.conclusion_date});});}
    else if(item.deadline_date){const iD=item.concluded==1,iOv=!iD&&new Date(item.deadline_date)<today;dlE.push({label:item.description,isDone:iD,isOver:iOv,deadline:item.deadline_date,conclusion_date:item.conclusion_date});}
  });
  if(dlE.length>0){
    y=doc.lastAutoTable.finalY+5;chk(22);
    doc.setFillColor(20,82,20);doc.roundedRect(mx,y,cw,9,2,2,'F');
    sf(10,true,[255,255,255]);doc.text('PRAZOS DE ENTREGA',mx+5,y+6.5);y+=13;
    doc.autoTable({startY:y,head:[['Item / Sub-item','Prazo','Conclus\u00e3o','Status']],
      body:dlE.map(e=>[e.label,fmtD(e.deadline),e.conclusion_date?fmtD(e.conclusion_date):'-',{content:e.isDone?'Conclu\u00eddo':(e.isOver?'Atrasado':'Pendente'),styles:{textColor:e.isDone?[16,185,129]:(e.isOver?[200,30,30]:[60,80,100])}}]),
      margin:{left:mx,right:mx,top:BODY_TOP,bottom:H-FTR_Y+4},
      styles:{fontSize:8,cellPadding:1.8,overflow:'linebreak',lineColor:[200,225,200],lineWidth:0.1},
      headStyles:{fillColor:[13,34,64],textColor:[255,255,255],fontStyle:'bold',fontSize:7.5},
      alternateRowStyles:{fillColor:[248,252,248]},
      didDrawPage:data=>{if(data.pageNumber>pageNum){cabecalho();pageNum=data.pageNumber;}rodape();}
    });
  }

  // ── Bloco PROGRESSO GERAL final ──
  y=doc.lastAutoTable?doc.lastAutoTable.finalY+5:y;chk(22);
  const blkC=pctGeral===100?[5,150,105]:[13,34,64];
  doc.setFillColor(...blkC);doc.roundedRect(mx,y,cw,16,3,3,'F');
  doc.setFillColor(110,192,46);doc.rect(mx,y,5,16,'F');
  sf(9,true,[255,255,255]);doc.text('PROGRESSO GERAL DA ATIVIDADE',mx+9,y+7);
  sf(7.5,false,[185,245,185]);doc.text(sec.name||'',mx+9,y+12.5);
  sf(16,true,pctGeral===100?[100,235,210]:[110,192,46]);doc.text(pctGeral+'%',W-mx,y+11,{align:'right'});

  // ── Numeração total (X/Y) ──
  rodape();
  const totalPages=doc.internal.getNumberOfPages();
  for(let p=1;p<=totalPages;p++){
    doc.setPage(p);sf(8,true,[185,245,185]);
    doc.text(p+'/'+totalPages,W-mx,FTR_Y+7,{align:'right'});
  }

  doc.save('atividade_'+(sec.name||'relatorio').replace(/\s+/g,'_').toLowerCase()+'_'+now.replace(/\//g,'-')+'.pdf');
  toast('PDF gerado!');
};

async function loadB64(url,fmt='jpeg',maxPx=600){return new Promise(res=>{const img=new Image();img.crossOrigin='Anonymous';img.onload=()=>{let nw=img.naturalWidth,nh=img.naturalHeight;if(nw>maxPx||nh>maxPx){const r=Math.min(maxPx/nw,maxPx/nh);nw=Math.round(nw*r);nh=Math.round(nh*r);}const c=document.createElement('canvas');c.width=nw;c.height=nh;const ctx=c.getContext('2d');if(fmt!=='png'){ctx.fillStyle='#ffffff';ctx.fillRect(0,0,nw,nh);}ctx.drawImage(img,0,0,nw,nh);res({d:c.toDataURL(fmt==='png'?'image/png':'image/jpeg',.65),w:nw,h:nh});};img.onerror=()=>res(null);img.src=url+(!url.startsWith('data:')?'?t='+Date.now():'');});}
</script>
<div id="busca-overlay" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.82);z-index:3000;padding:16px;box-sizing:border-box;overflow-y:auto">
  <div style="max-width:780px;margin:0 auto;background:#0e1729;border:1px solid #1e3a5f;border-radius:16px;padding:20px;position:relative">
    <button onclick="fecharBusca()" style="position:absolute;top:12px;right:16px;background:none;border:none;color:#64748b;font-size:22px;cursor:pointer">✕</button>
    <div style="font-size:16px;font-weight:800;margin-bottom:14px">🔍 Buscar na Atividade</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">
      <input id="busca-input" type="text" placeholder="Digite o texto a buscar..." onkeydown="if(event.key==='Enter')executarBusca()" style="flex:1;min-width:200px;padding:10px 14px;background:#020810;border:1px solid #1e3a5f;border-radius:8px;color:#e2e8f0;font-size:14px">
      <select id="busca-campo" style="padding:10px 14px;background:#020810;border:1px solid #1e3a5f;border-radius:8px;color:#e2e8f0;font-size:13px">
        <option value="todos">Todos os campos</option>
        <option value="nome">Nome / Descrição</option>
        <option value="resp">Responsáveis</option>
        <option value="obs">Observação</option>
      </select>
      <button onclick="executarBusca()" style="padding:10px 18px;background:#0e7490;color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer">🔍 Buscar</button>
      <button onclick="limparBusca()" style="padding:10px 14px;background:#334155;color:#e2e8f0;border:none;border-radius:8px;font-size:13px;cursor:pointer">✕ Limpar</button>
    </div>
    <div style="display:flex;gap:14px;flex-wrap:wrap;margin-bottom:10px;padding:10px 14px;background:#0a1222;border-radius:8px;border:1px solid #1e3a5f">
      <label style="display:flex;align-items:center;gap:7px;font-size:12px;color:#94a3b8;cursor:pointer"><input type="checkbox" id="bchk-allsubs-item" style="accent-color:#0e7490;width:14px;height:14px" onchange="if(window._buscaRes)executarBusca()"><span><strong style="color:#60a5fa">Item encontrado</strong> → mostrar todos os subitens</span></label>
      <label style="display:flex;align-items:center;gap:7px;font-size:12px;color:#94a3b8;cursor:pointer"><input type="checkbox" id="bchk-show-parent" style="accent-color:#8b5cf6;width:14px;height:14px" onchange="if(window._buscaRes)executarBusca()"><span><strong style="color:#a78bfa">Subitem encontrado</strong> → exibir item pai</span></label>
      <label style="display:flex;align-items:center;gap:7px;font-size:12px;color:#94a3b8;cursor:pointer"><input type="checkbox" id="bchk-allsubs-sub" style="accent-color:#f59e0b;width:14px;height:14px" onchange="if(window._buscaRes)executarBusca()"><span><strong style="color:#fcd34d">Subitem encontrado</strong> → mostrar subitens irmãos</span></label>
    </div>
    <div id="busca-resultados" style="margin-top:12px"></div>

</div>

<script>
let _buscaSecId=null;
function abrirBusca(secId){
  _buscaSecId=secId;
  window._buscaRes=null;
  document.getElementById('busca-input').value='';
  document.getElementById('busca-resultados').innerHTML='';
  document.getElementById('busca-overlay').style.display='block';
  setTimeout(()=>document.getElementById('busca-input').focus(),80);
}
function fecharBusca(){document.getElementById('busca-overlay').style.display='none';}
function limparBusca(){document.getElementById('busca-input').value='';document.getElementById('busca-resultados').innerHTML='';window._buscaRes=null;}
function _norm(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();}
function executarBusca(){
  const q=_norm(document.getElementById('busca-input').value.trim());
  const campo=document.getElementById('busca-campo').value;
  const secId=_buscaSecId;
  const sec=S.secs.find(s=>s.id===secId);
  if(!q||!sec){document.getElementById('busca-resultados').innerHTML='<div style="color:#64748b;text-align:center;padding:20px">Digite um termo para buscar.</div>';return;}
  const items=S.items.filter(i=>i.atividade_id===secId);
  const _match=val=>val&&_norm(String(val)).includes(q);
  const _matchIt=(it)=>{
    if(campo==='todos')return _match(it.description)||_match(it.observacao)||_match(it.responsaveis);
    if(campo==='nome')return _match(it.description);
    if(campo==='resp')return _match(it.responsaveis);
    if(campo==='obs')return _match(it.observacao);
    return false;
  };
  const hl=txt=>{if(!txt)return '';const re=new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');return String(txt).replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c])).replace(re,'<mark style="background:#f59e0b44;color:#fcd34d;border-radius:3px;padding:0 2px">$1</mark>');};
  const chkAllSubsItem=document.getElementById('bchk-allsubs-item').checked;
  const chkShowParent=document.getElementById('bchk-show-parent').checked;
  const chkAllSubsSub=document.getElementById('bchk-allsubs-sub').checked;
  const results=[];
  items.forEach(item=>{
    const allSubs=S.subitems.filter(s=>s.item_id===item.id);
    const itemMatch=_matchIt(item);
    const matchSubs=allSubs.filter(s=>_matchIt(s));
    if(itemMatch||matchSubs.length>0){
      let displaySubs=matchSubs;
      let showParentBadge=false;
      if(itemMatch&&chkAllSubsItem) displaySubs=allSubs;
      if(!itemMatch&&matchSubs.length>0){
        showParentBadge=chkShowParent;
        if(chkAllSubsSub) displaySubs=allSubs;
      }
      results.push({item,allSubs,matchSubs,displaySubs,itemMatch,showParentBadge});
    } else if(chkShowParent){
      // already handled above
    }
  });
  const total=results.reduce((t,r)=>t+(r.itemMatch?1:0)+r.matchSubs.length,0);
  let html=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px"><div style="font-size:13px;color:#64748b"><strong style="color:#38bdf8">${total}</strong> resultado(s) para "<strong>${q}</strong>"</div><button onclick="gerarPdfBusca()" style="padding:8px 14px;background:#8b5cf6;color:#fff;border:none;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer">📄 Gerar PDF dos Resultados</button></div>`;
  if(!results.length){html+='<div style="color:#64748b;text-align:center;padding:30px">Nenhum resultado encontrado.</div>';}
  html+='<div style="display:flex;flex-direction:column;gap:10px">';
  results.forEach(({item,allSubs,matchSubs,displaySubs,itemMatch,showParentBadge})=>{
    const isDone=item.concluded==1;
    const borderColor=itemMatch?'#0e7490':'#7c3aed';
    html+=`<div style="background:#0a1222;border-radius:12px;padding:14px;border:1px solid ${borderColor}">`;
    if(!itemMatch&&showParentBadge) html+=`<div style="font-size:10px;font-weight:700;color:#a78bfa;margin-bottom:4px">📌 ITEM PAI DO SUBITEM ENCONTRADO</div>`;
    html+=`<div style="font-size:14px;font-weight:700;color:${isDone?'#34d399':'#e2e8f0'}">${itemMatch?hl(item.description):item.description||''}</div>`;
    if(item.responsaveis) html+=`<div style="font-size:11px;color:#a78bfa;margin-top:3px">👤 ${itemMatch?hl(item.responsaveis):item.responsaveis}</div>`;
    if(item.observacao) html+=`<div style="font-size:11px;color:#64748b;margin-top:3px;font-style:italic">📝 ${itemMatch?hl(item.observacao):item.observacao}</div>`;
    html+=`<span style="font-size:11px;background:${isDone?'#10b98122':'#33415522'};color:${isDone?'#34d399':'#94a3b8'};border-radius:999px;padding:3px 10px;display:inline-block;margin-top:6px">${isDone?'✅ Concluído':'⏳ Pendente'}</span>`;
    if(displaySubs.length>0){
      const extra=displaySubs.length-matchSubs.length;
      if(extra>0) html+=`<div style="font-size:10px;color:#f59e0b;margin-top:8px;font-weight:600">📂 ${itemMatch?'Exibindo todos os subitens':'Subitens irmãos incluídos'} (${displaySubs.length} total, ${matchSubs.length} com match)</div>`;
      html+='<div style="margin-top:8px;padding-left:12px;border-left:2px solid #334155;display:flex;flex-direction:column;gap:6px">';
      displaySubs.forEach(s=>{
        const sD=s.concluded==1;
        const sMatched=matchSubs.some(ms=>ms.id===s.id);
        html+=`<div style="background:#0e1729;border-radius:8px;padding:8px 12px;border-left:2px solid ${sMatched?'#0e7490':'transparent'}"><div style="font-size:12px;font-weight:600;color:${sD?'#34d399':'#e2e8f0'}">  › ${sMatched?hl(s.description):s.description||''}</div>`;
        if(s.responsaveis) html+=`<div style="font-size:10px;color:#a78bfa;margin-top:2px">👤 ${sMatched?hl(s.responsaveis):s.responsaveis}</div>`;
        if(s.observacao) html+=`<div style="font-size:10px;color:#64748b;margin-top:2px;font-style:italic">📝 ${sMatched?hl(s.observacao):s.observacao}</div>`;
        html+='</div>';
      });
      html+='</div>';
    }
    html+='</div>';
  });
  html+='</div>';
  window._buscaRes={results,query:q,campo,secId};
  document.getElementById('busca-resultados').innerHTML=html;
}
async function gerarPdfBusca(){
  if(!window._buscaRes)return;
  const {results,query,campo,secId}=window._buscaRes;
  const sec=S.secs.find(s=>s.id===secId);
  if(!sec||!window.jspdf?.jsPDF){toast('jsPDF não carregado','error');return;}
  toast('Gerando PDF…','info',6000);
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({orientation:'landscape',unit:'mm',format:'a4'});
  const W=doc.internal.pageSize.getWidth(),H=doc.internal.pageSize.getHeight();
  const mx=14,BODY_TOP=28,FTR_Y=H-10;
  const campoLabel={todos:'Todos os campos',nome:'Nome/Descrição',resp:'Responsáveis',obs:'Observação'};
  const addDecor=()=>{
    doc.setFillColor(13,34,64);doc.rect(0,0,W,BODY_TOP-2,'F');
    doc.setFontSize(11);doc.setFont('helvetica','bold');doc.setTextColor(255,255,255);
    doc.text(sec.name+' — Resultados da Busca',mx,10);
    doc.setFontSize(8);doc.setFont('helvetica','normal');doc.setTextColor(180,210,255);
    doc.text('Campo: '+(campoLabel[campo]||campo)+' | Busca: "'+query+'"',mx,17);
    doc.text('Gerado em '+new Date().toLocaleDateString('pt-BR'),W-mx,17,{align:'right'});
    doc.setFillColor(13,34,64);doc.rect(0,H-14,W,14,'F');
    doc.setFontSize(7.5);doc.setTextColor(180,210,255);
    doc.text('Página '+doc.getCurrentPageInfo().pageNumber,W-mx,H-5,{align:'right'});
  };
  addDecor();
  const chkAllSubsItem=document.getElementById('bchk-allsubs-item').checked;
  const chkAllSubsSub=document.getElementById('bchk-allsubs-sub').checked;
  const iFill=[20,45,95],iTC=[220,235,255];
  const tblH=[['#','Item / Sub-item','Status','Responsáveis','Observação']];
  const tblB=[];let c=1;
  results.forEach(({item,allSubs,matchSubs,displaySubs,itemMatch})=>{
    let subsToRender=displaySubs;
    if(itemMatch&&chkAllSubsItem) subsToRender=allSubs;
    else if(!itemMatch&&matchSubs.length>0&&chkAllSubsSub) subsToRender=allSubs;
    const isDone=item.concluded==1;
    tblB.push([{content:String(c++),styles:{halign:'center',fontStyle:'bold',fillColor:iFill,textColor:iTC}},{content:item.description||'',styles:{fontStyle:'bold',fillColor:iFill,textColor:iTC}},{content:isDone?'✅ Concluído':'⏳ Pendente',styles:{fillColor:iFill,textColor:isDone?[100,230,175]:[180,200,240]}},{content:item.responsaveis||'',styles:{fillColor:iFill,textColor:iTC,fontSize:7.5}},{content:item.observacao||'',styles:{fillColor:iFill,textColor:iTC,fontSize:7.5}}]);
    subsToRender.forEach(s=>{
      const sD=s.concluded==1;
      tblB.push(['',{content:'  › '+(s.description||''),styles:{textColor:[150,170,200],fontSize:7.5}},{content:sD?'✅ Concluído':'⏳ Pendente',styles:{textColor:sD?[16,185,129]:[100,120,150],fontSize:7.5}},{content:s.responsaveis||'',styles:{textColor:[100,120,150],fontSize:7}},{content:s.observacao||'',styles:{textColor:[100,120,150],fontSize:7}}]);
    });
  });
  doc.autoTable({startY:BODY_TOP+2,head:tblH,body:tblB,margin:{left:mx,right:mx,top:BODY_TOP,bottom:H-FTR_Y+4},rowPageBreak:'avoid',styles:{fontSize:8,cellPadding:1.8,overflow:'linebreak',textColor:[26,32,44],lineColor:[200,225,200],lineWidth:0.1},headStyles:{fillColor:[13,34,64],textColor:[255,255,255],fontStyle:'bold',fontSize:7.5},columnStyles:{1:{cellWidth:'auto'}},didDrawPage:()=>addDecor()});
  doc.save((sec.name||'busca').replace(/[^a-zA-Z0-9À-ú ]/g,'_')+'_busca.pdf');
  toast('PDF gerado!','success');
}
</script>
